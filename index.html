<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마작 RPG</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#1f4a34,#0f2419 70%);color:#e8efe9;font:16px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
  .bg{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;background:#06100b;z-index:0}
  .bg i{background-size:cover;background-position:center;opacity:.42;filter:saturate(.9)}
  .bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(10,26,18,.93) 0,rgba(10,26,18,.78) 38%,rgba(10,26,18,.35) 80%)}
  .gate{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
  h1{margin:0;font:800 40px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.02em}
  .chip{width:72px;height:72px}
  .msg{min-height:1.6em;color:#cfdcd3;font-size:14.5px}
  .msg b{color:#fff}
  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:11px 20px;border-radius:12px;font-weight:700;background:#fff;color:#1f1f1f;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .btn svg{width:20px;height:20px}
  .btn.sub{background:rgba(255,255,255,.08);color:#e8efe9;border:1px solid rgba(255,255,255,.18);box-shadow:none;font-weight:600;padding:8px 16px;font-size:14px}
  .btn.gold{background:linear-gradient(#f6d77e,#d9a53a);color:#1b1406}
  .brow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .bar{width:min(320px,80vw);height:8px;border-radius:8px;background:rgba(0,0,0,.4);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9972e,#f3d27a);transition:width .2s}
  .up{display:flex;flex-direction:column;gap:10px;align-items:center;padding:16px;border:1px dashed rgba(243,210,122,.5);border-radius:12px;max-width:360px}
  .up small{color:#9fb3a6}
  [hidden]{display:none!important}
  a{color:#8cc8ff}
  .note{max-width:380px;font-size:13px;line-height:1.7;color:#9fb3a6;border-top:1px solid rgba(255,255,255,.12);padding-top:14px}
  .note b{color:#e8efe9}
</style>
<script>/* ==== 일본어 선택(i18n): 한국어 원문은 그대로 두고, 日本語일 때만 화면 글자를 사전으로 바꿔 보여 준다 ==== */
(function(){
  let L = 'ko';
  try{ L = localStorage.getItem('rm.lang') || (/^ja/i.test(navigator.language || '') ? 'ja' : 'ko'); }catch(_){}
  window.LANG = L;
  const D = {"마작 RPG": "麻雀RPG", "불러오는 중…": "読み込み中…", "구글로 로그인": "Googleでログイン", "게임 소개": "ゲーム紹介", "게임 업데이트 (운영자)": "ゲーム更新(運営者)", "게임 시작": "ゲーム開始", "다른 계정으로 로그인": "別のアカウントでログイン", "플레이어 등록을 원하시면 사용하실 Gmail 계정으로": "プレイヤー登録をご希望の方は、使用するGmailアカウントで", "(운영자)에 메일을 보내 주세요.": "(運営者)にメールをお送りください。", "이 게임은 무료이며 현금 결제·환전이 없습니다.": "このゲームは無料で、現金での決済・換金はありません。", "게임 속 칩은 게임 안에서만 쓰는 재화로, 사행성과 무관합니다.": "ゲーム内のチップはゲーム内だけで使う通貨で、賭博性とは無関係です。", "등록된 이메일 주소는 아래 방침을 철저히 따릅니다.": "登録されたメールアドレスは下記の方針に厳格に従って取り扱います。", "개인정보처리방침": "プライバシーポリシー", "오프라인 · 기기에 받아 둔 게임으로 시작": "オフライン · 端末に保存したゲームで開始", "인터넷 연결이 필요합니다": "インターネット接続が必要です", "로그인 중…": "ログイン中…", "팝업이 막혔습니다 · 브라우저에서 팝업 허용": "ポップアップがブロックされました · ブラウザでポップアップを許可してください", "로그인 실패": "ログイン失敗", "등록된 계정으로 로그인하세요": "登録されたアカウントでログインしてください", "· 운영자": "· 運営者", "· 확인 중…": "· 確認中…", "초대받은 사람만 플레이할 수 있습니다": "招待された人だけがプレイできます", "아직 게임이 올라오지 않았습니다": "まだゲームがアップロードされていません", "새 버전 받는 중…": "新しいバージョンを取得中…", "받기 실패 · 이전 버전으로 시작": "取得失敗 · 以前のバージョンで開始", "게임을 받지 못했습니다 · 다시 시도해 주세요": "ゲームを取得できませんでした · もう一度お試しください", "압축 중…": "圧縮中…", "올리는 중…": "アップロード中…", "업로드 완료": "アップロード完了", "조각": "分割", "업로드 실패 ·": "アップロード失敗 ·", "또는 X": "または X", "DM으로도 신청할 수 있어요.": "のDMでも申し込めます。", "구글 계정으로 로그인하면 바로 가입돼요. 선착순 30명까지예요.": "Googleアカウントでログインするとすぐに登録されます。先着30名までです。", "소식은 X ": "お知らせはX ", "에서 전해요.": "でお届けします。", "로그인한 이메일 주소는 아래 방침을 철저히 따릅니다.": "ログインしたメールアドレスは下記の方針に厳格に従って取り扱います。", "구글 계정으로 로그인하세요": "Googleアカウントでログインしてください", "이용이 제한된 계정입니다": "利用が制限されたアカウントです", "정원 30명이 다 찼어요": "定員30名に達しました", "가입하는 중…": "登録しています…"};
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const keys = Object.keys(D).sort((a, b) => b.length - a.length);
  const LK = keys.filter(k => k.length > 2), SK = keys.filter(k => k.length <= 2);
  const reL = new RegExp(LK.map(esc).join('|'), 'g');
  const reS = new RegExp('(?<![\\uac00-\\ud7a3])(?:' + SK.map(esc).join('|') + ')(?![\\uac00-\\ud7a3])', 'g');
  const H = /[가-힣]/;
  const tr = s => { if(!s || !H.test(s)) return s; s = s.replace(reL, m => D[m]); if(H.test(s)) s = s.replace(reS, m => D[m]); return s; };
  window.jaTr = tr;
  const OT = new WeakMap(), OA = new WeakMap();   // 원래 한국어(되돌리기용)
  const setT = (n, t) => { if(!OT.has(n)) OT.set(n, n.nodeValue); n.nodeValue = t; };
  const NOTR = e => !!(e && e.closest && (e.closest('.notr') || (e.closest('.netchat') && !e.closest('.sys'))));   // 채팅: 사람이 쓴 말은 그대로, 시스템 줄(.sys)만 번역
  const SKIP = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, NOSCRIPT: 1 };
  const ATTR = ['placeholder', 'title', 'aria-label', 'alt'];
  function el(e){ for(const a of ATTR){ const v = e.getAttribute && e.getAttribute(a); if(v && H.test(v)){ const t = tr(v); if(t !== v){ const o = OA.get(e) || {}; if(!(a in o)) o[a] = v; OA.set(e, o); e.setAttribute(a, t); } } } if(e.tagName === 'INPUT' && (e.type === 'button' || e.type === 'submit') && H.test(e.value)) e.value = tr(e.value); }
  function walk(root){
    if(!root) return;
    if(root.nodeType === 3){ const p = root.parentNode; if(p && !SKIP[p.nodeName] && !NOTR(p)){ const v = root.nodeValue, t = tr(v); if(t !== v) setT(root, t); } return; }
    if(root.nodeType !== 1 || SKIP[root.nodeName] || (root.closest && root.closest('.notr'))) return;
    el(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, { acceptNode: n => (n.nodeType === 1 && (SKIP[n.nodeName] || n.classList.contains('notr')) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) });
    let n; while((n = w.nextNode())){ if(n.nodeType === 1) el(n); else { const v = n.nodeValue; if(NOTR(n.parentNode)) continue; if(H.test(v)){ const t = tr(v); if(t !== v) setT(n, t); } } }
  }
  let obs = null;
  function on(){
    walk(document.body); if(H.test(document.title)) document.title = tr(document.title);
    if(obs) return;
    obs = new MutationObserver(ms => { for(const m of ms){ if(m.type === 'childList') m.addedNodes.forEach(walk); else if(m.type === 'characterData') walk(m.target); else if(m.type === 'attributes') el(m.target); } });
    obs.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTR });
  }
  function off(){ if(obs){ obs.disconnect(); obs = null; }
    const w = document.createTreeWalker(document.body, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT); let n;
    while((n = w.nextNode())){ if(n.nodeType === 3){ if(OT.has(n)){ n.nodeValue = OT.get(n); OT.delete(n); } } else { const o = OA.get(n); if(o){ for(const a in o) n.setAttribute(a, o[a]); OA.delete(n); } } }
    if(document.title === '麻雀RPG') document.title = '마작 RPG'; }
  window.setLang = l => { try{ localStorage.setItem('rm.lang', l); }catch(_){} window.LANG = l; if(l === 'ja'){ on(); } else { off(); } try{ render(); }catch(_){} if(l === 'ja') walk(document.body); document.documentElement.lang = l; };
  document.documentElement.lang = L;
  const start = () => { if(window.LANG === 'ja') on(); };
  if(document.body) start(); else document.addEventListener('DOMContentLoaded', start);
  document.addEventListener('change', e => { const id = e.target && e.target.id; if(id !== 's-ja' && id !== 's-ko') return; const l = (id === 's-ja') === e.target.checked ? 'ja' : 'ko'; window.setLang(l); const a = document.getElementById('s-ja'), k = document.getElementById('s-ko'); if(a) a.checked = l === 'ja'; if(k) k.checked = l !== 'ja'; });
})();
</script>

// ---- 기기 보관(IndexedDB) ----
const idb = () => new Promise((ok, ng) => { const r = indexedDB.open('mjgate', 1); r.onupgradeneeded = () => r.result.createObjectStore('g'); r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); });
const cacheGet = async () => { try{ const d = await idb(); return await new Promise(ok => { const q = d.transaction('g').objectStore('g').get('game'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); }catch(e){ return null; } };
const cachePut = async v => { try{ const d = await idb(); await new Promise(ok => { const t = d.transaction('g', 'readwrite'); t.objectStore('g').put(v, 'game'); t.oncomplete = ok; t.onerror = ok; }); }catch(e){} };
// ---- 압축 ----
const gz = async txt => { const buf = await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer(); let s = ''; const u = new Uint8Array(buf); for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const ungz = async b64 => { const s = atob(b64), u = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); };
// ---- 실행: 이 문서를 게임으로 바꾼다(같은 주소·같은 저장소) ----
let ran = false;
function run(html){ if(ran) return; ran = true; window.__GATE = 1; document.open(); document.write(html); document.close(); }
let lib = null;
async function boot(){
  try{
    const V = '10.12.2', b = `https://www.gstatic.com/firebasejs/${V}/`;
    const [a, au, fs] = await Promise.all([import(b + 'firebase-app.js'), import(b + 'firebase-auth.js'), import(b + 'firebase-firestore-lite.js')]);
    const app = a.getApps().length ? a.getApp() : a.initializeApp(CFG);
    lib = { au, fs, auth: au.getAuth(app), db: fs.getFirestore(app) };
  }catch(e){ const c = await cacheGet(); if(c){ say('오프라인 · 기기에 받아 둔 게임으로 시작'); setTimeout(() => run(c.html), 400); } else say('인터넷 연결이 필요합니다'); return; }
  $('login').onclick = async () => { try{ say('로그인 중…'); await lib.au.signInWithPopup(lib.auth, new lib.au.GoogleAuthProvider()); }catch(e){ say(e && e.code === 'auth/popup-blocked' ? '팝업이 막혔습니다 · 브라우저에서 팝업 허용' : '로그인 실패'); } };
  $('logout').onclick = async () => { await lib.au.signOut(lib.auth); try{ localStorage.removeItem('rm.sync.uid'); }catch(e){} location.reload(); };
  $('play').onclick = () => start(true);
  $('file').onchange = upload;
  lib.au.onAuthStateChanged(lib.auth, u => {
    if(ran) return;   // 게임으로 바뀐 뒤에는 입구는 손대지 않는다
    $('login').hidden = !!u; $('logout').hidden = !u; $('note').hidden = !!u;
    if(!u){ say('구글 계정으로 로그인하세요'); return; }
    if(u.email === OWNER && location.hash === '#upload'){ $('up').hidden = false; say(`<b>${u.email}</b> · 운영자`); return; }
    start(false);
  });
}
async function start(){
  const u = lib.auth.currentUser; say(`<b>${u.displayName || u.email}</b> · 확인 중…`);
  const c = await cacheGet();
  let meta = null;
  try{ const s = await lib.fs.getDoc(lib.fs.doc(lib.db, 'game', 'meta')); meta = s.exists() ? s.data() : null; }
  catch(e){
    if(e && e.code === 'permission-denied'){ const j = await join(u); if(j === 'ok') return start(); say(j === 'full' ? `<b>${u.email}</b><br>정원 30명이 다 찼어요` : `<b>${u.email}</b><br>이용이 제한된 계정입니다`); $('note').hidden = false; return; }
    if(c){ say('오프라인 · 기기에 받아 둔 게임으로 시작'); setTimeout(() => run(c.html), 400); return; }
    say('인터넷 연결이 필요합니다'); return;
  }
  if(!meta){ say('아직 게임이 올라오지 않았습니다'); return; }
  if(c && c.v === meta.v){ run(c.html); return; }   // 같은 버전: 받아 둔 것으로 바로
  say('새 버전 받는 중…'); prog(0);
  try{
    let done = 0;
    const parts = await Promise.all(Array.from({ length: meta.n }, async (_, i) => { const s = await lib.fs.getDoc(lib.fs.doc(lib.db, 'game', 'p' + i)); prog(++done / meta.n); return s.data().d; }));
    const html = await ungz(parts.join(''));
    await cachePut({ v: meta.v, html }); prog(null); run(html);
  }catch(e){ prog(null); if(c){ say('받기 실패 · 이전 버전으로 시작'); setTimeout(() => run(c.html), 600); } else say('게임을 받지 못했습니다 · 다시 시도해 주세요'); }
}
// 처음 들어온 사람: 선착순 가입(회원 명단 members/계정번호 + 가입자 수 access/count.n 을 한 번에). 정원(max)이 차면 'full'
async function join(u){
  const f = lib.fs, cRef = f.doc(lib.db, 'access', 'count');
  say(`<b>${u.displayName || u.email}</b> · 가입하는 중…`);
  try{
    await f.runTransaction(lib.db, async tx => {
      const c = await tx.get(cRef), d = c.exists() ? c.data() : null;
      if(!d || d.n >= d.max) throw { code: 'full' };
      tx.update(cRef, { n: d.n + 1 }); tx.set(f.doc(lib.db, 'members', u.uid), { email: u.email || '', name: u.displayName || '', t: Date.now() });
    });
    return 'ok';
  }catch(e){ return e && e.code === 'full' ? 'full' : 'err'; }
}
async function upload(){
  const f = $('file').files[0]; if(!f) return;
  try{
    say('압축 중…'); prog(0);
    const b64 = await gz(await f.text()), n = Math.ceil(b64.length / CHUNK);
    for(let i = 0; i < n; i++){ await lib.fs.setDoc(lib.fs.doc(lib.db, 'game', 'p' + i), { d: b64.slice(i * CHUNK, (i + 1) * CHUNK) }); prog((i + 1) / (n + 1)); say(`올리는 중… ${i + 1}/${n}`); }
    await lib.fs.setDoc(lib.fs.doc(lib.db, 'game', 'meta'), { v: Date.now(), n, size: f.size });
    prog(null); say(`<b>업로드 완료</b> · ${(f.size / 1048576).toFixed(1)}MB · ${n}조각`);
  }catch(e){ prog(null); say('업로드 실패 · ' + (e && e.code || e)); }
}
boot();
</script>
