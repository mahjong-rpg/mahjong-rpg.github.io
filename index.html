<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마작 RPG</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 0%,#1f4a34,#0f2419 70%);color:#e8efe9;font:16px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
  .bg{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;background:#06100b;z-index:0}
  .bg i{background-size:cover;background-position:center;opacity:.42;filter:saturate(.9)}
  .bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(10,26,18,.93) 0,rgba(10,26,18,.78) 38%,rgba(10,26,18,.35) 80%)}
  .gate{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
  h1{margin:0;font:800 40px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.02em}
  .chip{width:72px;height:72px}
  .msg{min-height:1.6em;color:#cfdcd3;font-size:14.5px}
  .msg b{color:#fff}
  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:11px 20px;border-radius:12px;font-weight:700;background:#fff;color:#1f1f1f;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .btn svg{width:20px;height:20px}
  .btn.sub{background:rgba(255,255,255,.08);color:#e8efe9;border:1px solid rgba(255,255,255,.18);box-shadow:none;font-weight:600;padding:8px 16px;font-size:14px}
  .btn.gold{background:linear-gradient(#f6d77e,#d9a53a);color:#1b1406}
  .brow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .bar{width:min(320px,80vw);height:8px;border-radius:8px;background:rgba(0,0,0,.4);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9972e,#f3d27a);transition:width .2s}
  .up{display:flex;flex-direction:column;gap:10px;align-items:center;padding:16px;border:1px dashed rgba(243,210,122,.5);border-radius:12px;max-width:360px}
  .up small{color:#9fb3a6}
  [hidden]{display:none!important}
  a{color:#8cc8ff}
  .note{max-width:380px;font-size:13px;line-height:1.7;color:#9fb3a6;border-top:1px solid rgba(255,255,255,.12);padding-top:14px}
  .note b{color:#e8efe9}
</style>
</head>

<script type="module">
// 입구: 구글 로그인 → 허락된 계정이면 Firestore(game/*)에서 게임 파일을 받아 이 주소 그대로 실행(기기 기록 유지)
// 게임은 기기(IndexedDB)에 남겨 두고, 새 버전이 올라왔을 때만 다시 받는다. 인터넷이 없으면 남겨 둔 게임으로 실행
const CFG = { apiKey:'AIzaSyA71uCghM3gazaX-HVIbJEDa6zwoqBqfXA', authDomain:'mahjong-rpg-poker-blackjack.firebaseapp.com', projectId:'mahjong-rpg-poker-blackjack', storageBucket:'mahjong-rpg-poker-blackjack.firebasestorage.app', messagingSenderId:'728732325986', appId:'1:728732325986:web:7cc1a72a647ef6adf6193b' };
const OWNER = 'ekacks77@gmail.com', CHUNK = 900000;
const $ = id => document.getElementById(id), say = h => { $('msg').innerHTML = h; };
const prog = f => { $('bar').hidden = f == null; if(f != null) $('barI').style.width = Math.round(f * 100) + '%'; };
// ---- 기기 보관(IndexedDB) ----
const idb = () => new Promise((ok, ng) => { const r = indexedDB.open('mjgate', 1); r.onupgradeneeded = () => r.result.createObjectStore('g'); r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); });
const cacheGet = async () => { try{ const d = await idb(); return await new Promise(ok => { const q = d.transaction('g').objectStore('g').get('game'); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); }catch(e){ return null; } };
const cachePut = async v => { try{ const d = await idb(); await new Promise(ok => { const t = d.transaction('g', 'readwrite'); t.objectStore('g').put(v, 'game'); t.oncomplete = ok; t.onerror = ok; }); }catch(e){} };
// ---- 압축 ----
const gz = async txt => { const buf = await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer(); let s = ''; const u = new Uint8Array(buf); for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const ungz = async b64 => { const s = atob(b64), u = new Uint8Array(s.length); for(let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); };
// ---- 실행: 이 문서를 게임으로 바꾼다(같은 주소·같은 저장소) ----
let ran = false;
function run(html){ if(ran) return; ran = true; window.__GATE = 1; document.open(); document.write(html); document.close(); }
let lib = null;
async function boot(){
  try{
    const V = '10.12.2', b = `https://www.gstatic.com/firebasejs/${V}/`;
    const [a, au, fs] = await Promise.all([import(b + 'firebase-app.js'), import(b + 'firebase-auth.js'), import(b + 'firebase-firestore-lite.js')]);
    const app = a.getApps().length ? a.getApp() : a.initializeApp(CFG);
    lib = { au, fs, auth: au.getAuth(app), db: fs.getFirestore(app) };
  }catch(e){ const c = await cacheGet(); if(c){ say('오프라인 · 기기에 받아 둔 게임으로 시작'); setTimeout(() => run(c.html), 400); } else say('인터넷 연결이 필요합니다'); return; }
  $('login').onclick = async () => { try{ say('로그인 중…'); await lib.au.signInWithPopup(lib.auth, new lib.au.GoogleAuthProvider()); }catch(e){ say(e && e.code === 'auth/popup-blocked' ? '팝업이 막혔습니다 · 브라우저에서 팝업 허용' : '로그인 실패'); } };
  $('logout').onclick = async () => { await lib.au.signOut(lib.auth); try{ localStorage.removeItem('rm.sync.uid'); }catch(e){} location.reload(); };
  $('play').onclick = () => start(true);
  $('file').onchange = upload;
  lib.au.onAuthStateChanged(lib.auth, u => {
    if(ran) return;   // 게임으로 바뀐 뒤에는 입구는 손대지 않는다
    $('login').hidden = !!u; $('logout').hidden = !u; $('note').hidden = !!u;
    if(!u){ say('등록된 계정으로 로그인하세요'); return; }
    if(u.email === OWNER && location.hash === '#upload'){ $('up').hidden = false; say(`<b>${u.email}</b> · 운영자`); return; }
    start(false);
  });
}
async function start(){
  const u = lib.auth.currentUser; say(`<b>${u.displayName || u.email}</b> · 확인 중…`);
  const c = await cacheGet();
  let meta = null;
  try{ const s = await lib.fs.getDoc(lib.fs.doc(lib.db, 'game', 'meta')); meta = s.exists() ? s.data() : null; }
  catch(e){
    if(e && e.code === 'permission-denied'){ say(`<b>${u.email}</b><br>초대받은 사람만 플레이할 수 있습니다`); $('note').hidden = false; return; }
    if(c){ say('오프라인 · 기기에 받아 둔 게임으로 시작'); setTimeout(() => run(c.html), 400); return; }
    say('인터넷 연결이 필요합니다'); return;
  }
  if(!meta){ say('아직 게임이 올라오지 않았습니다'); return; }
  if(c && c.v === meta.v){ run(c.html); return; }   // 같은 버전: 받아 둔 것으로 바로
  say('새 버전 받는 중…'); prog(0);
  try{
    let done = 0;
    const parts = await Promise.all(Array.from({ length: meta.n }, async (_, i) => { const s = await lib.fs.getDoc(lib.fs.doc(lib.db, 'game', 'p' + i)); prog(++done / meta.n); return s.data().d; }));
    const html = await ungz(parts.join(''));
    await cachePut({ v: meta.v, html }); prog(null); run(html);
  }catch(e){ prog(null); if(c){ say('받기 실패 · 이전 버전으로 시작'); setTimeout(() => run(c.html), 600); } else say('게임을 받지 못했습니다 · 다시 시도해 주세요'); }
}
async function upload(){
  const f = $('file').files[0]; if(!f) return;
  try{
    say('압축 중…'); prog(0);
    const b64 = await gz(await f.text()), n = Math.ceil(b64.length / CHUNK);
    for(let i = 0; i < n; i++){ await lib.fs.setDoc(lib.fs.doc(lib.db, 'game', 'p' + i), { d: b64.slice(i * CHUNK, (i + 1) * CHUNK) }); prog((i + 1) / (n + 1)); say(`올리는 중… ${i + 1}/${n}`); }
    await lib.fs.setDoc(lib.fs.doc(lib.db, 'game', 'meta'), { v: Date.now(), n, size: f.size });
    prog(null); say(`<b>업로드 완료</b> · ${(f.size / 1048576).toFixed(1)}MB · ${n}조각`);
  }catch(e){ prog(null); say('업로드 실패 · ' + (e && e.code || e)); }
}
boot();
</script>
