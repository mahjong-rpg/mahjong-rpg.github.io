<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마작 RPG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 마작 탁자(펠트) 위 세로 스택 — 위에 상대 셋, 아래 내 강·손패. 한 가지 룩(어두운 펠트)으로 고정 */
:root{
  --felt:#163a2e; --felt-2:#1d4738; --felt-line:#2c5c4a;
  --ink:#eef2ea; --ink-dim:#a9bdb2; --brass:#d8b45a; --alert:#e2675b;
  --ivory:#fefdf8; --ivory-2:#f4f2e8; --ivory-edge:#cfcbbb; --tile-back:#1d5f9a; --tile-back-hi:#3a86c8;
  --cloth:#0f5a3f; --cloth-hi:#177552; --rim:#3a2a1c; --rim-dark:#22180f; --led:#ffc65c; --led-dim:#b8a47a;
  --man:#b3261e; --pin:#1f5aa0; --sou:#1b7442; --hon:#24302b;
  --panel:rgba(0,0,0,.22); --panel-2:rgba(0,0,0,.34);
  --f-ui: "Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --f-tile: "Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif KR","Batang",serif;
  --f-con: "Times New Roman","Noto Serif","Nanum Myeongjo",Georgia,serif;
  --f-num: ui-monospace,"SF Mono","Menlo","Consolas",monospace;
  color-scheme: dark;
}
[hidden]{display:none!important}
html{min-height:100%;background:var(--felt)}
body{min-height:100%}
body{margin:0;background:var(--felt);color:var(--ink);font:15px/1.5 var(--f-ui);
  background-image:radial-gradient(ellipse at 50% 30%, var(--felt-2), var(--felt) 70%);background-repeat:no-repeat;background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px;}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.tile:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;text-wrap:balance}
.muted{color:var(--ink-dim)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* 버튼 */
.btn{border:1px solid var(--felt-line);background:var(--panel-2);border-radius:8px;padding:10px 14px;font-weight:600}
.btn:hover{border-color:var(--brass)}
.btn.primary{background:var(--brass);color:#1b1a12;border-color:var(--brass)}
.btn.warn{background:var(--alert);border-color:var(--alert);color:#fff}
.btn.rcguide{pointer-events:none;cursor:default;opacity:.6;background:transparent}
.btn.small{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 패: 상아색 앞면 + 파란 뒷판(2층 패) */
.tile{--w:22px;display:inline-block;position:relative;flex:none;vertical-align:bottom;user-select:none;
  width:var(--w);height:calc(var(--w)*1.36);background:linear-gradient(var(--ivory) 0%,var(--ivory-2) 72%,#dfdccd 100%);
  border-radius:calc(var(--w)*.13);
  box-shadow:inset 0 0 0 1px var(--ivory-edge),0 calc(var(--w)*.09) 0 var(--tile-back),0 calc(var(--w)*.12) calc(var(--w)*.14) rgba(0,0,0,.38)}
.tile svg{position:absolute;left:7%;top:5%;width:86%;height:88%;overflow:visible}
.tile.lg{--w:var(--hw)}
.tile.md{--w:30px}
.tile.sm{--w:22px}
.tile.rv{--w:var(--rw)}
.tile.dr{--w:calc(var(--rw)*.92)}
/* 엎어 둔 패(안깡 양끝): 패산 패처럼 위는 색 뒷판, 아래 두께는 상아색 앞판 */
.tile.facedown{background:linear-gradient(var(--tile-back-hi) 0%,var(--tile-back) 100%);
  box-shadow:0 0 0 .5px rgba(0,0,0,.65),0 calc(var(--w)*.09) 0 #e2ddcd,0 calc(var(--w)*.09) 0 .5px rgba(0,0,0,.55),0 calc(var(--w)*.12) calc(var(--w)*.14) rgba(0,0,0,.38)}
.tile.rii{transform:rotate(-90deg);margin:0 calc(var(--w)*.18)}
.tile.gone{opacity:.3}
.tile.tg{filter:brightness(.93)}
.tile.last{}
.back{display:inline-block;flex:none;width:var(--bw);height:calc(var(--bw)*1.12);border-radius:calc(var(--bw)*.06);
  background:linear-gradient(var(--tile-back-hi) 0%,var(--tile-back) 70%,#f4f1e6 70%,#dcd8c8 100%);box-shadow:0 0 0 .6px rgba(0,0,0,.65),0 2px 3px rgba(0,0,0,.35)}
.layer.side .edge .back{height:calc(var(--bw)*.8);background:linear-gradient(var(--tile-back-hi) 0,var(--tile-back) 42%,#f4f1e6 42%,#dcd8c8 100%)}
:root{--below:calc(var(--hw)*1.5 + 152px);--hw:min(50px, calc((min(100vw, 760px) - 44px) / 14.8))}

/* 전동마작탁: 정사각형 탁자, 가운데 콘솔, 각 자리 레이어를 돌려서 배치 */
.game{display:flex;flex-direction:column;gap:4px;align-items:center}
.game{padding-top:38px}
.game, .game *{-webkit-user-select:none;user-select:none}   /* 끄는 도중 글씨가 긁혀 선택되지 않게 */
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;height:34px;padding:4px max(6px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px));
  display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.topbar > *{pointer-events:auto}
.topbar .muted{font-size:12px;line-height:1}
.topbar .btn.small{height:28px;min-width:28px;padding:0 8px;display:inline-grid;place-items:center;font-size:15px;line-height:1}
.topbar .xbtn{font-size:18px;font-weight:400}
.topbar .hbtn{font-size:16px;font-weight:700;min-width:36px}
.help h3{font-size:14px;margin:10px 0 4px;color:var(--ink-dim,#9fb5a9)}
.help ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px;line-height:1.45}
.help kbd{display:inline-block;padding:0 6px;border-radius:5px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);font:inherit;font-size:12px;white-space:nowrap}
.table{--S:min(calc(100vw - 32px), max(260px, calc(100dvh - var(--below))), 660px);
  --C:calc(var(--S)*.33); --rw:calc(var(--C)/6.2); --bw:calc(var(--S)*.05);
  width:var(--S);height:var(--S);position:relative;border-radius:0;
  background:radial-gradient(circle at 50% 50%, var(--cloth-hi), var(--cloth) 72%);
  box-shadow:0 0 0 calc(var(--S)*.014) var(--rim), 0 0 0 calc(var(--S)*.02) var(--rim-dark), 0 14px 30px rgba(0,0,0,.45)}
.console{position:absolute;left:calc((var(--S) - var(--C))/2);top:calc((var(--S) - var(--C))/2);width:var(--C);height:var(--C);
  border-radius:calc(var(--C)*.08);background:linear-gradient(145deg,#24292b,#101314);box-shadow:inset 0 0 0 2px #3b4346,0 4px 10px rgba(0,0,0,.5)}
.layer{position:absolute;inset:0;pointer-events:none;z-index:2}   /* 각 자리(강·손패·퐁/북/구종구패 알림)는 패산보다 위 */
.strip{position:absolute;left:calc((var(--S) - var(--C))/2 + var(--C)*.17);width:calc(var(--C)*.66);top:calc((var(--S) + var(--C))/2 - var(--C)*.19);height:calc(var(--C)*.17);
  display:flex;align-items:center;justify-content:center;gap:calc(var(--C)*.04);font:700 calc(var(--C)*.105) var(--f-num);color:var(--led-dim);letter-spacing:.02em}
.strip{font-family:var(--f-con);font-weight:400;color:#f2f2f2;align-items:baseline}
.strip.on{color:#fff}
.strip .w{font-family:var(--f-tile);color:#7d8285;font-weight:400}
.strip .w.dealer{color:#fff}
.strip .sc{font-size:1.25em;line-height:1}
.strip .df{display:none}
.layer.mekika .strip{pointer-events:auto}
@media (hover:hover){   /* PC: 마우스를 올려 둔 동안 */
  .table:has(.layer.mekika .strip:hover) .layer:not(.mekika) .strip .sc:not(.df){display:none}
  .table:has(.layer.mekika .strip:hover) .layer:not(.mekika) .strip .df{display:inline}
}
.table.showdiff .layer:not(.mekika) .strip .sc:not(.df){display:none}   /* 아이폰: 점수를 터치하면 3초간 */
.table.showdiff .layer:not(.mekika) .strip .df{display:inline}
.strip .sc small{font-size:.62em;color:#7d8285;margin-left:.04em}
.turnbar{position:absolute;left:calc((var(--S) - var(--C))/2 + var(--C)*.08);width:calc(var(--C)*.84);top:calc((var(--S) + var(--C))/2 - var(--C)*.035);height:calc(var(--C)*.028);border-radius:99px;background:#21b14b;box-shadow:0 0 6px rgba(33,177,75,.8)}
.stick{position:absolute;left:50%;top:calc((var(--S) + var(--C))/2 - var(--C)*.035);transform:translateX(-50%);width:calc(var(--C)*.6);height:calc(var(--C)*.045);
  height:calc(var(--C)*.06)}
.stick .stk2{filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.river{position:absolute;left:calc((var(--S) - var(--C))/2);top:calc((var(--S) + var(--C))/2 + var(--S)*.012);width:calc(var(--rw)*6.2);
  display:flex;flex-direction:column;gap:calc(var(--rw)*.04);align-items:flex-start}
.river .rrow{display:flex;flex-wrap:nowrap;gap:calc(var(--rw)*.04);align-items:flex-start;min-height:calc(var(--rw)*1.36)}   /* 강은 3단까지: 1·2단 6장씩, 3단부터는 오른쪽으로 계속 붙인다 */
/* 상대 손패는 가운데, 울은 패는 그 사람 기준 오른쪽 벽에 붙인다(기가마크·연장봉이 있으면 그 왼쪽). 멘쯔끼리도 틈 없이 */
.edge{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(max-content,1fr);align-items:end;justify-content:end}   /* 넘치면 손패 쪽(왼쪽)으로 밀려난다 */
.edge .ehand{display:flex;gap:1px;align-items:flex-end;margin-bottom:calc(var(--S)*.012)}
.edge .ehand .hgap{width:calc(var(--bw)*.35);flex:none}
.edge .ehand .back.hole{visibility:hidden}
/* 울은 패 줄은 탁 아래 벽에 바짝(패 두께까지 포함), 북빼기는 그 한 줄 위에 따로 놓고 오른쪽 벽에 붙인다 */
.edge .emelds{display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--bw)*.3);justify-self:end}
.edge .emelds.on{margin-left:var(--bw)}   /* 손패와 울은 패 사이는 아무리 붙어도 패 1장 거리 */
.edge .mrow{display:flex;gap:0;align-items:flex-end;min-height:calc(var(--bw)*.9*1.36);padding-bottom:calc(var(--bw)*.9*.09)}
.edge .nrow{display:flex;gap:0;align-items:flex-end;padding-bottom:calc(var(--bw)*.9*.09)}
.edge .meld{display:flex;gap:0}

.edge .tile{--w:calc(var(--bw)*.9)}
.callout{position:absolute;left:50%;top:calc((var(--S) + var(--C))/2 + var(--S)*.06);transform:translateX(-50%);
  font:800 calc(var(--S)*.06) var(--f-ui);color:#fff;background:var(--alert);padding:.1em .6em;border-radius:.4em;box-shadow:0 6px 16px rgba(0,0,0,.45);
  animation:pop .25s ease-out;white-space:nowrap;z-index:3}
@keyframes pop{from{scale:.6;opacity:0}to{scale:1;opacity:1}}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(var(--C)*.62);display:flex;flex-direction:column;align-items:center;gap:calc(var(--C)*.03);text-align:center;color:var(--ink)}
.center .rd{font:400 calc(var(--C)*.2) var(--f-con);line-height:1;display:flex;align-items:baseline;gap:.02em;white-space:nowrap}
.center .rd .rw{font-family:var(--f-tile);color:#7d8285}   /* 東·南도 局과 같은 글씨체·색 */
.center .rd .rn{color:#fff}
.center .rd .rk{font-family:var(--f-tile);color:#7d8285}
.center .info{display:flex;align-items:center;gap:calc(var(--C)*.035);font:400 calc(var(--C)*.095) var(--f-con);color:#f2f2f2;line-height:1;padding-top:calc(var(--C)*.02);border-top:1px solid #3a4144}
.center .sub{font:400 calc(var(--C)*.08) var(--f-ui);color:#9aa0a3}
.ico{display:inline-block;width:calc(var(--C)*.04);height:calc(var(--C)*.085);background:#f4f4ef;border-radius:1px;position:relative;vertical-align:middle}
.ico.hb{background:radial-gradient(circle,#222 32%,transparent 36%) 0 0/50% 25% #f4f4ef}
.ico.rb::after{content:"";position:absolute;left:50%;top:50%;width:70%;height:30%;transform:translate(-50%,-50%);border-radius:50%;background:#d0161a}
.center .dora{display:flex;gap:2px}
.myarea{width:100%;display:flex;flex-direction:column;gap:0;align-items:center}
.hand{display:flex;gap:1px;align-items:flex-end;justify-content:center;min-height:calc(var(--hw)*1.36 + var(--hw)*.24);padding-top:calc(var(--hw)*.24);max-width:100%}
.hand .gap{width:calc(var(--hw)*.35);flex:none}
.hand .tile.slot{visibility:hidden}
.hand .tile{cursor:pointer;transition:transform .08s}
/* 손패도 탁 위·울은 패와 같은 패 디자인(흰 앞면 · 둥근 모서리 · 아래쪽 두께) */
.hand .tile.sel{transform:translateY(-10px)}
.hand .tile.off{opacity:.42;cursor:not-allowed}
.hand .tile.hint{outline:3px solid #4fb0ff;outline-offset:1px}
.hand .mymeld{display:flex;gap:1px;margin-left:6px}
.hand .mymeld:not(.nukis) + .mymeld:not(.nukis){margin-left:0}   /* 내 울은 패도 멘쯔끼리 붙인다 */
.hand .mymeld .tile{--w:calc(var(--hw)*.72)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:44px;align-items:center}
.prompt{font-size:13px;color:var(--ink-dim);text-align:center;min-height:1.5em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 상단 막대 */
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;background:var(--panel);border-radius:10px;padding:8px 12px}
.bar .k{font-weight:700;letter-spacing:.02em}
/* 국 끝 분석 */
.kyrev{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--felt-line);padding-top:12px}
.kyrev .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.why{font-size:12.5px;color:var(--led);}
/* 분석 카드: 판 상황 · 유효패 */
.board{background:var(--panel);border-radius:8px;padding:6px 8px}
.board summary{cursor:pointer;font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap;list-style-position:inside}
.bbody{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.brow{display:grid;grid-template-columns:58px minmax(0,1fr);gap:6px;align-items:start;font-size:12px}
.bwho{display:flex;flex-direction:column;gap:2px;line-height:1.2}
.rv{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end}
.bml{display:inline-flex;gap:4px;margin-left:6px}
.tile.seen::before{content:"";position:absolute;left:1px;top:1px;width:6px;height:6px;border-radius:50%;background:var(--led);z-index:1;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.ukrow{display:flex;flex-direction:column;gap:4px}
.uks{display:flex;flex-wrap:wrap;gap:6px 4px}
.uk{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.uk i{font:700 11px var(--f-num);font-style:normal;color:var(--ink)}
.uk i::before{content:"×"}
.uk.zero .tile{opacity:.35}.uk.zero i{color:var(--alert)}
.dec .lines{gap:8px}
.winblk{display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px dashed var(--felt-line)}
.winblk h3{font-size:15px}
.boardwrap{container-type:inline-size;width:100%;display:flex;justify-content:center;padding:10px 0 6px}
.table.mini{--S:min(100cqw - 8px, 520px)}
.board[open] summary{margin-bottom:2px}
.btn.hintbtn{box-shadow:0 0 0 3px #4fb0ff;position:relative}
.btn.hintbtn::after{content:"AI";position:absolute;top:-8px;right:-6px;font:700 10px var(--f-ui);background:#4fb0ff;color:#06223a;border-radius:99px;padding:1px 5px}
/* 패 2세트: 국마다 파랑·노랑 뒷면 번갈아 */
.setb{--tile-back:#b5841f; --tile-back-hi:#e8b947}
/* 울은 패: 눕힌 패(가로). 패 두께는 세로패와 같이 아래쪽에 보이게 하고, 한 멘쯔 안에서는 틈 없이 붙인다 */
.tile.yoko{width:calc(var(--w)*1.36);height:var(--w)}
.tile.yoko svg{left:50%;top:50%;width:calc(var(--w)*.86);height:calc(var(--w)*1.197);transform:translate(-50%,-50%) rotate(-90deg)}
.kst{display:inline-flex;flex-direction:column-reverse;flex:none;align-self:flex-end;vertical-align:bottom}
.kst > .tile{position:relative}
.kst > .tile.up{box-shadow:inset 0 0 0 1px var(--ivory-edge)}   /* 위에 올린 패는 두께·그림자 없이 아래 패에 바로 맞닿게 */
.meld,.mymeld,.edge .meld,.hand .mymeld{gap:0 !important}
.meld,.mymeld{align-items:flex-end}
/* 플레이어 시점 패산 */
.wallsc{position:absolute;inset:0;pointer-events:none;z-index:1}
.wallsc.front{z-index:3}   /* 내 앞 패산은 내 강보다 나에게 가까우니 강 위에 보인다 */
.wnext{pointer-events:auto;cursor:pointer;animation:wglow 1s ease-in-out infinite alternate}
@keyframes wglow{from{filter:brightness(1)}to{filter:brightness(1.45)}}
.hand .tile.slot.pend{visibility:visible;cursor:default;background:none;box-shadow:none}
.flytile .tile{box-shadow:0 8px 18px rgba(0,0,0,.45)}
@media (prefers-reduced-motion: reduce){.wnext{animation:none}}
.sk{position:absolute;transform:translate(-50%,-50%)}
.sk.h{width:var(--ww);height:calc(var(--ww)*1.52)}
/* 주사위 세기: 세는 자리의 패산 한 줄이 붉게 빛나고, 결정되면 잠깐 멈춰 번쩍 */
.sk.hl::after,.sk.cnt::after{content:"";position:absolute;inset:0;border-radius:calc(var(--ww)*.1);pointer-events:none;z-index:3;
  background:rgba(255,40,30,.5);box-shadow:0 0 calc(var(--ww)*.45) calc(var(--ww)*.06) rgba(255,50,35,.85)}
.sk.hl.fin::after{animation:hlfin .34s ease-out both}
/* 아리스: 새로 뒤집힌 패산 패 + 동일패가 있으면 붉게 깜빡 */
.sk .tf.afl{animation:aflp .4s ease-out both;transform-origin:50% 100%}
@keyframes aflp{from{opacity:0;transform:scaleY(.1)}to{opacity:1;transform:none}}
/* 자리 정할 때 패산 줄이 빛나던 것과 같은 붉은 형광색(결정될 때 번쩍이던 밝은 상태)으로 깜빡인다 */
.sk.hl.ablk::after{background:rgba(255,90,65,.9);box-shadow:0 0 calc(var(--ww)*.9) calc(var(--ww)*.2) rgba(255,70,40,1);animation:ablink .4s ease-in-out infinite alternate}
@keyframes ablink{from{opacity:.05}to{opacity:1}}
.hand .tile.ahit::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;background:rgba(255,90,65,.9);box-shadow:0 0 14px 3px rgba(255,70,40,1);animation:ablink .4s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){.sk .tf.afl,.sk.hl.ablk::after,.hand .tile.ahit::after{animation:none}}
@keyframes hlfin{0%{background:rgba(255,120,90,.9);box-shadow:0 0 calc(var(--ww)*.9) calc(var(--ww)*.2) rgba(255,70,40,1)}100%{background:rgba(255,40,30,.55)}}

.sk .urap{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:calc(var(--ww)*.08);background:linear-gradient(#fefdf8 0%,#f4f2e8 72%,#dfdccd 100%);

  box-shadow:inset 0 0 0 1px var(--ivory-edge),0 calc(var(--ww)*.2) 0 #e2ddcd,0 calc(var(--ww)*.2) 0 .5px rgba(0,0,0,.45),0 calc(var(--ww)*.32) 0 var(--tile-back),

<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal" hidden></div>

<script>
(function (root) {
'use strict';

// ---------- 기본 ----------
const HONOR_CH = ['東', '南', '西', '北', '白', '發', '中'];
const SUIT_KR = ['만', '통', '삭'];
const kindOf = id => id >> 2;
const isRedId = id => { const k = id >> 2; return k === 4 || k === 13 || k === 22; };   // 모든 5(만·통·삭)는 적도라
const SHIRO_ID = 124;   // 3인 마작 시로폿치: 白(31) 4장 중 1장 (올 마이티)
const isHonor = k => k >= 27;
const isYaochu = k => k >= 27 || k % 9 === 0 || k % 9 === 8;
const isDragon = k => k >= 31;
const isWind = k => k >= 27 && k <= 30;
const GREEN = new Set([19, 20, 21, 23, 25, 32]);
const YAOCHU = [0, 8, 9, 17, 18, 26, 27, 28, 29, 30, 31, 32, 33];
const ceil100 = x => Math.ceil(x / 100) * 100;

function doraOf(ind) {
  if (ind < 27) return Math.floor(ind / 9) * 9 + (ind % 9 + 1) % 9;
  if (ind <= 30) return 27 + ((ind - 27 + 1) % 4);
  return 31 + ((ind - 31 + 1) % 3);
}
function kindName(k) {
  if (k >= 27) return HONOR_CH[k - 27];
  return (k % 9 + 1) + 'mps'[Math.floor(k / 9)];
}
function countsOf(ids) {
  const c = new Array(34).fill(0);
  for (const id of ids) c[id >> 2]++;
  return c;
}
function countsOfKinds(ks) {
  const c = new Array(34).fill(0);
  for (const k of ks) c[k]++;
  return c;
}

// ---------- 향청수 ----------
const optCache = new Map();
function groupOpts(c, base, len, honor) {
  let key = honor ? 'h' : 's';
  for (let i = 0; i < len; i++) key += c[base + i];
  let r = optCache.get(key);
  if (r) return r;
  const a = [];
  for (let i = 0; i < len; i++) a.push(c[base + i]);
  const set = new Set();
  const rec = (i, m, t, p) => {
    while (i < len && a[i] === 0) i++;
    if (i >= len) { set.add(m * 1000 + t * 10 + p); return; }
    if (a[i] >= 3) { a[i] -= 3; rec(i, m + 1, t, p); a[i] += 3; }
    if (!honor && i + 2 < len && a[i + 1] && a[i + 2]) {
      a[i]--; a[i + 1]--; a[i + 2]--; rec(i, m + 1, t, p); a[i]++; a[i + 1]++; a[i + 2]++;
    }
    if (a[i] >= 2) {
      a[i] -= 2;
      if (p === 0) rec(i, m, t, 1);
      rec(i, m, t + 1, p);
      a[i] += 2;
    }
    if (!honor && i + 1 < len && a[i + 1]) { a[i]--; a[i + 1]--; rec(i, m, t + 1, p); a[i]++; a[i + 1]++; }
    if (!honor && i + 2 < len && a[i + 2]) { a[i]--; a[i + 2]--; rec(i, m, t + 1, p); a[i]++; a[i + 2]++; }
    a[i]--; rec(i, m, t, p); a[i]++;
  };
  rec(0, 0, 0, 0);
  r = [...set].map(v => [Math.floor(v / 1000), Math.floor(v / 10) % 100, v % 10]);
  optCache.set(key, r);
  return r;
}
function shantenNormal(c, meldCount) {
  const gs = [groupOpts(c, 0, 9, false), groupOpts(c, 9, 9, false), groupOpts(c, 18, 9, false), groupOpts(c, 27, 7, true)];
  let cur = [[0, 0, 0]];
  for (const g of gs) {
    const next = new Map();
    for (const a of cur) for (const o of g) {
      const p = a[2] + o[2];
      if (p > 1) continue;
      const m = a[0] + o[0], t = a[1] + o[1];
      const key = m * 1000 + t * 10 + p;
      if (!next.has(key)) next.set(key, [m, t, p]);
    }
    cur = [...next.values()];
  }
  let best = 8;
  for (const [m0, t0, p] of cur) {
    const m = Math.min(4, m0 + meldCount);
    const t = Math.max(0, Math.min(t0, 4 - m));
    const s = 8 - 2 * m - t - p;
    if (s < best) best = s;
  }
  return best;
}
function shantenChiitoi(c) {
  let pairs = 0, kinds = 0;
  for (let i = 0; i < 34; i++) { if (c[i] >= 1) kinds++; if (c[i] >= 2) pairs++; }
  return 6 - pairs + Math.max(0, 7 - kinds);
}
function shantenKokushi(c) {
  let k = 0, pair = 0;
  for (const i of YAOCHU) { if (c[i] >= 1) k++; if (c[i] >= 2) pair = 1; }
  return 13 - k - pair;
}
function shanten(c, meldCount) {
  let s = shantenNormal(c, meldCount);
  if (meldCount === 0) s = Math.min(s, shantenChiitoi(c), shantenKokushi(c));
  return s;
}
function waitsOf(c, meldCount) {
  const w = [];
  for (let k = 0; k < 34; k++) {
    if (c[k] >= 4) continue;
    c[k]++;
    if (shanten(c, meldCount) === -1) w.push(k);
    c[k]--;
  }
  return w;
}
function ukeire(c, meldCount, vis, cur) {
  if (cur === undefined) cur = shanten(c, meldCount);
  let n = 0;
  const kinds = [];
  for (let k = 0; k < 34; k++) {
    if (c[k] >= 4) continue;
    c[k]++;
    const s = shanten(c, meldCount);
    c[k]--;
    if (s < cur) { const left = Math.max(0, 4 - vis[k]); n += left; kinds.push(k); }
  }
  return { n, kinds };
}

// ---------- 화료 분해 ----------
function decompose(c) {
  const res = [];
  for (let h = 0; h < 34; h++) {
    if (c[h] < 2) continue;
    c[h] -= 2;
    decRec(c, 0, [], res, h);
    c[h] += 2;
  }
  return res;
}
function decRec(c, i, ms, res, h) {
  while (i < 34 && c[i] === 0) i++;
  if (i >= 34) { res.push({ head: h, mentsu: ms.slice() }); return; }
  if (c[i] >= 3) { c[i] -= 3; ms.push({ t: 'k', k: i }); decRec(c, i, ms, res, h); ms.pop(); c[i] += 3; }
  if (i < 27 && i % 9 <= 6 && c[i + 1] && c[i + 2]) {
    c[i]--; c[i + 1]--; c[i + 2]--;
    ms.push({ t: 's', k: i }); decRec(c, i, ms, res, h); ms.pop();
    c[i]++; c[i + 1]++; c[i + 2]++;
  }
}
function isChiitoi(c) {
  let pairs = 0;
  for (let i = 0; i < 34; i++) { if (c[i] === 2) pairs++; else if (c[i] !== 0) return false; }
  return pairs === 7;
}
function isChuuren(c) {
  for (let s = 0; s < 3; s++) {
    let tot = 0;
    for (let i = 0; i < 9; i++) tot += c[s * 9 + i];
    if (tot !== 14) continue;
    const need = [3, 1, 1, 1, 1, 1, 1, 1, 3];
    if (need.every((n, i) => c[s * 9 + i] >= n)) return true;
  }
  return false;
}

// ---------- 점수 (작혼 룰: 키리아게 만관 없음, 헤아림 역만 있음, 더블 역만 있음, 역만 복합 있음) ----------
function basePoints(han, fu, yakuman) {
  if (yakuman) return 8000 * yakuman;
  if (han >= 13) return 8000;
  if (han >= 11) return 6000;
  if (han >= 8) return 4000;
  if (han >= 6) return 3000;
  if (han >= 5) return 2000;
  return Math.min(2000, fu * Math.pow(2, han + 2));
}
function limitName(han, fu, yakuman) {
  if (yakuman) return yakuman > 1 ? yakuman + '배 역만' : '역만';
  if (han >= 13) return '헤아림 역만';
  if (han >= 11) return '삼배만';
  if (han >= 8) return '배만';
  if (han >= 6) return '하네만';
  if (han >= 5 || fu * Math.pow(2, han + 2) >= 2000) return '만관';
  return '';
}
const isKanType = t => t === 'ankan' || t === 'minkan' || t === 'kakan';

// 상황역(리치·일발·쯔모·영상·창깡·해저/하저)
function situationYaku(ctx, menzen) {
  const y = [];
  if (ctx.doubleRiichi) y.push(['더블 리치', 2]);
  else if (ctx.riichi) y.push(['리치', 1]);
  if (ctx.ippatsu) y.push(['일발', 1]);
  if (menzen && ctx.tsumo) y.push(['멘젠쯔모', 1]);
  if (ctx.rinshan) y.push(['영상개화', 1]);
  if (ctx.chankan) y.push(['창깡', 1]);
  if (ctx.last && !ctx.rinshan && !ctx.chankan) y.push([ctx.tsumo ? '해저로월' : '하저로어', 1]);
  return y;
}

function finalize(ctx, yaku, yakuman, fu) {
  const allIds = (ctx.countIds || ctx.closed).concat(...ctx.melds.map(m => m.ids), ctx.nuki || []);
  const ym = yakuman.slice();
  if (ctx.tenhou) ym.push(['천화', 1]);
  if (ctx.chiihou) ym.push(['지화', 1]);
  if (ym.length) {
    const n = ym.reduce((a, y) => a + y[1], 0);
    const base = basePoints(0, 0, n);
    return { yaku: ym.map(y => [y[0], y[1] > 1 ? y[1] + '배 역만' : '역만']), yakumanNames: ym.map(y => y[0]), han: 13 * n, fu: 0, yakuman: n, base, label: limitName(0, 0, n), score: base * 1000 };
  }
  const list = yaku.slice();
  const yakuHan = yaku.reduce((a, y) => a + y[1], 0);
  if (yakuHan === 0) return null;
  const dOf = ind => ctx.sanma && ind === 0 ? 8 : ctx.sanma && ind === 8 ? 0 : doraOf(ind);   // 3인: 1만→9만→1만
  const doraK = ctx.doraInd.map(dOf);
  const uraK = ctx.riichi ? ctx.uraInd.map(dOf) : [];
  let dora = 0, ura = 0, aka = 0;
  for (const id of allIds) {
    const k = kindOf(id);
    for (const d of doraK) if (d === k) dora++;
    for (const u of uraK) if (u === k) ura++;
    if (ctx.aka && isRedId(id)) aka++;
  }
  if (dora) list.push(['도라', dora]);
  const nk = (ctx.nuki || []).length;
  if (nk) list.push(['북도라', nk]);
  if (aka) list.push(['적도라', aka]);
  if (ura) list.push(['뒷도라', ura]);
  const han = yakuHan + dora + aka + ura + nk;
  const base = basePoints(han, fu, 0);
  return { yaku: list, yakumanNames: [], han, fu, yakuman: 0, base, label: limitName(han, fu, 0), score: base * 1000 + han * 10 + fu / 10 };
}

function evaluateWin(ctx) {
  // ctx: closed(ids,화료패 포함), melds[{type,ids}], winKind, tsumo, seatWind, roundWind,
  //      riichi, doubleRiichi, ippatsu, last, rinshan, chankan, tenhou, chiihou, doraInd, uraInd, aka
  const c = countsOf(ctx.closed);
  const open = ctx.melds.some(m => m.type !== 'ankan');
  const noMelds = ctx.melds.length === 0;
  let best = null;
  const consider = r => { if (r && (!best || r.score > best.score)) best = r; };
  if (noMelds && shantenKokushi(c) === -1) consider(finalize(ctx, [], [c[ctx.winKind] === 2 ? ['국사무쌍 13면', 2] : ['국사무쌍', 1]], 0));
  if (noMelds && isChiitoi(c)) consider(evalChiitoi(ctx, c));
  const meldGroups = ctx.melds.map(m => ({ t: m.type === 'chi' ? 's' : 'k', k: Math.min(...m.ids.map(kindOf)), open: m.type !== 'ankan', kan: isKanType(m.type) }));
  for (const d of decompose(c)) {
    const opts = [];
    if (d.head === ctx.winKind) opts.push({ wait: 'tanki', idx: -1 });
    d.mentsu.forEach((m, i) => {
      if (m.t === 'k' && m.k === ctx.winKind) opts.push({ wait: 'shanpon', idx: i });
      if (m.t === 's' && ctx.winKind >= m.k && ctx.winKind <= m.k + 2) {
        const pos = ctx.winKind - m.k;
        let w;
        if (pos === 1) w = 'kanchan';
        else if (pos === 0) w = (m.k % 9 === 6) ? 'penchan' : 'ryanmen';
        else w = (m.k % 9 === 0) ? 'penchan' : 'ryanmen';
        opts.push({ wait: w, idx: i });
      }
    });
    for (const o of opts) consider(evalStandard(ctx, d, o, meldGroups, open, c));
  }
  return best;
}

function evalChiitoi(ctx, c) {
  const kinds = [];
  for (let i = 0; i < 34; i++) if (c[i]) kinds.push(i);
  if (kinds.every(isHonor)) return finalize(ctx, [], [['자일색', 1]], 25);
  const y = situationYaku(ctx, true);
  y.push(['치또이츠', 2]);
  if (kinds.every(k => !isYaochu(k))) y.push(['탕야오', 1]);
  if (kinds.every(isYaochu)) y.push(['혼노두', 2]);
  const suits = new Set(kinds.filter(k => !isHonor(k)).map(k => Math.floor(k / 9)));
  if (suits.size === 1) y.push(kinds.some(isHonor) ? ['혼일색', 3] : ['청일색', 6]);
  return finalize(ctx, y, [], 25);
}

function evalStandard(ctx, d, o, meldGroups, open, c) {
  const groups = d.mentsu.map((m, i) => ({ t: m.t, k: m.k, open: false, kan: false, ronDone: !ctx.tsumo && o.wait === 'shanpon' && o.idx === i })).concat(meldGroups);
  const head = d.head;
  const menzen = !open;
  const shuntsu = groups.filter(g => g.t === 's');
  const koutsu = groups.filter(g => g.t === 'k');
  const anko = koutsu.filter(g => !g.open && !g.ronDone).length;
  const kans = groups.filter(g => g.kan).length;
  const yakuhaiK = k => isDragon(k) || k === ctx.seatWind || k === ctx.roundWind;
  const tk = [];
  for (const g of groups) { if (g.t === 's') tk.push(g.k, g.k + 1, g.k + 2); else tk.push(g.k, g.k, g.k); }
  tk.push(head, head);

  const ym = [];
  if (koutsu.filter(g => isDragon(g.k)).length === 3) ym.push(['대삼원', 1]);
  if (tk.every(isHonor)) ym.push(['자일색', 1]);
  if (tk.every(k => GREEN.has(k))) ym.push(['녹일색', 1]);
  if (tk.every(k => !isHonor(k) && isYaochu(k))) ym.push(['청노두', 1]);
  const windK = koutsu.filter(g => isWind(g.k)).length;
  if (windK === 4) ym.push(['대사희', 2]);
  else if (windK === 3 && isWind(head)) ym.push(['소사희', 1]);
  if (anko === 4) ym.push(o.wait === 'tanki' ? ['사암각 단기', 2] : ['사암각', 1]);
  if (kans === 4) ym.push(['스깡쯔', 1]);
  if (ctx.melds.length === 0 && isChuuren(c)) {
    const cc = c.slice(); cc[ctx.winKind]--;
    const s = Math.floor(ctx.winKind / 9);
    const pure = [3, 1, 1, 1, 1, 1, 1, 1, 3].every((n, i) => cc[s * 9 + i] === n);
    ym.push(pure ? ['순정구련보등', 2] : ['구련보등', 1]);
  }
  if (ym.length) return finalize(ctx, [], ym, 0);

  const y = situationYaku(ctx, menzen);
  const pinfu = menzen && shuntsu.length === 4 && !yakuhaiK(head) && o.wait === 'ryanmen';
  if (pinfu) y.push(['핑후', 1]);
  if (tk.every(k => !isYaochu(k))) y.push(['탕야오', 1]);
  if (menzen) {
    const cnt = {};
    shuntsu.forEach(g => { cnt[g.k] = (cnt[g.k] || 0) + 1; });
    let pr = 0;
    for (const v of Object.values(cnt)) pr += Math.floor(v / 2);
    if (pr === 2) y.push(['량페코', 3]);
    else if (pr === 1) y.push(['이페코', 1]);
  }
  for (const g of koutsu) {
    if (isDragon(g.k)) y.push(['역패 ' + HONOR_CH[g.k - 27], 1]);
    if (g.k === ctx.seatWind) y.push(['자풍 ' + HONOR_CH[g.k - 27], 1]);
    if (g.k === ctx.roundWind) y.push(['장풍 ' + HONOR_CH[g.k - 27], 1]);
  }
  const grpYao = g => g.t === 's' ? (g.k % 9 === 0 || g.k % 9 === 6) : isYaochu(g.k);
  if (shuntsu.length > 0 && groups.every(grpYao) && isYaochu(head)) {
    if (tk.some(isHonor)) y.push(['찬타', menzen ? 2 : 1]);
    else y.push(['준찬타', menzen ? 3 : 2]);
  }
  for (let s = 0; s < 3; s++) {
    if ([0, 3, 6].every(n => shuntsu.some(g => g.k === s * 9 + n))) { y.push(['일기통관', menzen ? 2 : 1]); break; }
  }
  for (let n = 0; n < 7; n++) {
    if ([0, 1, 2].every(s => shuntsu.some(g => g.k === s * 9 + n))) { y.push(['삼색동순', menzen ? 2 : 1]); break; }
  }
  for (let n = 0; n < 9; n++) {
    if ([0, 1, 2].every(s => koutsu.some(g => g.k === s * 9 + n))) { y.push(['삼색동각', 2]); break; }
  }
  if (koutsu.length === 4) y.push(['또이또이', 2]);
  if (anko === 3) y.push(['삼암각', 2]);
  if (kans === 3) y.push(['산깡쯔', 2]);
  if (koutsu.filter(g => isDragon(g.k)).length === 2 && isDragon(head)) y.push(['소삼원', 2]);
  if (tk.every(isYaochu)) y.push(['혼노두', 2]);
  const suits = new Set(tk.filter(k => !isHonor(k)).map(k => Math.floor(k / 9)));
  if (suits.size === 1) {
    if (tk.some(isHonor)) y.push(['혼일색', menzen ? 3 : 2]);
    else y.push(['청일색', menzen ? 6 : 5]);
  }

  let fu;
  if (pinfu) fu = ctx.tsumo ? 20 : 30;
  else {
    fu = 20;
    if (menzen && !ctx.tsumo) fu += 10;
    if (ctx.tsumo) fu += 2;
    for (const g of groups) {
      if (g.t !== 'k') continue;
      let v = isYaochu(g.k) ? 4 : 2;
      if (!g.open && !g.ronDone) v *= 2;
      if (g.kan) v *= 4;
      fu += v;
    }

// ---------- 분석 AI ----------
function dangerOf(g, q, k, vis) {
  const safe = g.safeKindsAgainst(q);
  if (safe.has(k)) return 0;
  if (k >= 27) {
    const v = vis[k];
    if (v >= 3) return 1;
    if (v === 2) return 3;
    if (v === 1) return 7;
    return 9;
  }
  const n = k % 9 + 1;
  const base = { 1: 6, 9: 6, 2: 9, 8: 9, 3: 11, 7: 11, 4: 14, 5: 15, 6: 14 }[n];
  const lo = n - 3 >= 1 && safe.has(k - 3);
  const hi = n + 3 <= 9 && safe.has(k + 3);
  let f = 1;
  if (n <= 3) { if (hi) f = 0.3; }
  else if (n >= 7) { if (lo) f = 0.3; }
  else { if (lo && hi) f = 0.3; else if (lo || hi) f = 0.6; }
  return Math.max(1, Math.round(base * f));
}
function tieValue(g, s, k, c, vis) {

    v = yak ? 20 + vis[k] * 5 : 30 + vis[k] * 3;
    if (c[k] >= 2) v -= 25;
  } else {
    const n = k % 9;
    v = (n === 0 || n === 8) ? 15 : (n === 1 || n === 7) ? 8 : 0;
    let iso = c[k] < 2;
    for (let d = -2; d <= 2 && iso; d++) {
      if (d === 0 || n + d < 0 || n + d > 8) continue;
      if (c[k + d] > 0) iso = false;
    }
    if (iso) v += 6;
  }
  if (g.doraKinds().includes(k)) v -= 12;
  return v;
}
function advise(g, s, forbidden) {
  const p = g.players[s];
  const c = countsOf(p.hand);
  const mc = p.melds.length;
  const vis = g.visibleCounts(s);
  const threats = g.players.filter(q => q.seat !== s && q.riichi);
  const kinds = [...new Set(p.hand.map(kindOf))];
  let legal = forbidden ? kinds.filter(k => !forbidden.includes(k)) : kinds;
  if (!legal.length) legal = kinds;
  if (g.sanma) { const nn = legal.filter(k => k !== 30); if (nn.length) legal = nn; }   // 3인: 北은 버리지 않고 뺀다
  const cands = legal.map(k => {
    c[k]--;
    const sh = shanten(c, mc);
    const u = ukeire(c, mc, vis, sh);
    c[k]++;
    const danger = threats.reduce((a, q) => a + dangerOf(g, q, k, vis), 0);
    return { kind: k, sh, uke: u.n, ukeKinds: u.kinds, danger, tie: tieValue(g, s, k, c, vis) };
  });
  const bestSh = Math.min(...cands.map(x => x.sh));
  let mode = 'eff';
  if (threats.length) {
    if (bestSh >= 2) mode = 'fold';
    else if (bestSh === 1) mode = cands.some(x => x.sh === 1 && x.danger <= 4) ? 'careful' : 'fold';
    else mode = cands.some(x => x.sh === 0 && (x.danger <= 9 || x.uke >= 4)) ? 'push' : 'fold';
  }
  for (const x of cands) {
    const eff = -x.sh * 1000 + x.uke;
    if (mode === 'eff') { x.main = eff; x.sec = 0; }
    else if (mode === 'fold') { x.main = -x.danger; x.sec = eff; }
    else if (mode === 'careful') { x.main = (x.sh === 1 && x.danger <= 4) ? 1000 + x.uke : -x.danger; x.sec = eff; }
    else { x.main = x.sh === 0 ? 1000 + x.uke * 2 - x.danger : -x.danger; x.sec = eff; }
  }
  cands.sort((a, b) => b.main - a.main || b.sec - a.sec || b.tie - a.tie);
  return { best: cands[0], cands, mode, threat: threats.length > 0, bestSh };
}
function pickId(hand, k, preferRed) {
  const ids = hand.filter(id => kindOf(id) === k);
  const nonRed = ids.filter(id => !isRedId(id));
  if (preferRed) return ids.find(isRedId) ?? ids[0];
  return nonRed.length ? nonRed[0] : ids[0];
}

// ---------- 게임 (작혼 단위 룰) ----------
const SEAT_KR = ['나', '하가', '대면', '상가'];
class Game {
  constructor(opts) {

    this.controllers = this.opts.controllers;
    this.rand = this.opts.rand || Math.random;
    this.humanSeat = this.opts.humanSeat;
    const st = this.opts.state;
    this.N = this.opts.players === 3 ? 3 : 4;                     // 3인 마작이면 3
    this.sanma = this.N === 3;
    this.startPts = this.sanma ? 35000 : 25000;
    this.target = this.sanma ? 40000 : 30000;                     // 반환점(이 점수 이상이 있어야 종료)
    this.seats = [...Array(this.N).keys()];
    this.scores = st ? st.scores.slice() : this.seats.map(() => this.startPts);
    this.kyoku = st ? st.kyoku : 0;
    // 기가(첫 친) 정하기: 내가 가(仮) 동가로 주사위 두 개를 굴려, 합을 나부터 반시계(하가 쪽)로 센 자리가 기가
    const die = () => 1 + Math.floor(this.rand() * 6);
    // 자리·기가 정하기 (일본식 2번 굴리기)
    //  1) 東南西北 패를 엎어 섞고 한 장씩 뽑는다 → 東을 뽑은 사람이 가동(仮東)
    //  2) 가동이 주사위 → 합을 가동부터 반시계로 센 사람이 가친(仮親)
    //  3) 가친이 주사위 → 합을 가친부터 센 사람이 기가(起家, 첫 친)
    if (st && st.oya0 != null) { this.oya0 = st.oya0; this.seatDraw = st.seatDraw || null; }
    else if (st) { this.oya0 = 0; this.seatDraw = null; }
    else {
      const kariton = Math.floor(this.rand() * this.N);
      const d1 = [die(), die()], kario = (kariton + d1[0] + d1[1] - 1) % this.N;
      const d2 = [die(), die()];
      this.oya0 = (kario + d2[0] + d2[1] - 1) % this.N;
      this.seatDraw = { kariton, d1, kario, d2 };
    }
    this.honba = st ? st.honba : 0;
    this.kyotaku = st ? st.kyotaku : 0;
    this.decisions = st ? st.decisions.slice() : [];
    this.results = st ? st.results.slice() : [];
    this.totalKyoku = this.opts.length === 'south' ? 2 * this.N : this.N;   // 이 국수까지가 정규 (3인은 바람마다 3국)
    this.maxKyoku = this.totalKyoku + this.N;                              // 연장은 다음 바람까지
    this.listeners = [];
    this.players = [];
    this.wall = [];
    this.dead = [];
    this.doraInd = [];
    this.uraInd = [];
    this.doraIndIds = [];
    this.log = [];
  }
  on(fn) { this.listeners.push(fn); }
  emit(type, data) { for (const l of this.listeners) l(type, data); }
  get dealer() { return (this.kyoku + this.oya0) % this.N; }
  roundWind() { return 27 + Math.floor(this.kyoku / this.N); }
  seatWind(s) { return 27 + ((s - this.dealer + this.N) % this.N); }
  kyokuLabel() { return ['동', '남', '서', '북'][Math.floor(this.kyoku / this.N)] + ' ' + (this.kyoku % this.N + 1) + '국 · ' + this.honba + '본장'; }
  // 3인 왕패: 영상패 8장(4줄) + 도라 표시패 1줄 = 10장. 산패는 도라 표시패 바로 앞까지 쯔모하고, 깡도라는 산패 꽁무니 한 줄을 넘겨받아 뒤집는다
  get deadSize() { return this.sanma ? 10 : 14; }
  get doraBase() { return this.sanma ? 8 : 4; }

  doraKinds() { return this.doraInd.map(doraOf); }
  saveState() {
    return { players: this.N, scores: this.scores.slice(), kyoku: this.kyoku, honba: this.honba, kyotaku: this.kyotaku, decisions: this.decisions.slice(), results: this.results.slice(), oya0: this.oya0, seatDraw: this.seatDraw };
  }
  visibleCounts(s) {

        for (const id of m.ids) v[id >> 2]++;
      }
    }

    for (const p of this.players) for (const id of (p.nuki || [])) v[id >> 2]++;

  async run() {
    while (true) {
      const res = await this.playKyoku();
      res.label = this.kyokuLabel();
      res.kyoku = this.kyoku;
      res.dealer = this.dealer;

      res.scores = this.scores.slice();

  revealDora() {
    const n = this.doraIndIds.length;

    if (this.sanma && n > 0) {   // 3인 깡도라: 산패 꽁무니 한 줄(윗패 표시패, 아랫패 뒷도라)을 왕패로 넘긴다

      }

  // 연습용: 첫 국 배패를 텐파이로 만든다 (패산·다른 손패와 맞바꿔 장수는 그대로)
  rigTenpai(s) {
    const p = this.players[s];
    const want = [0, 1, 2, 12, 13, 14, 24, 25, 26, 22, 22, 5, 6];   // 123만 456통 789삭 55삭 67만 → 5·8만 대기
    const locked = new Set();
    for (const k of want) {
      let i = p.hand.findIndex((id, j) => !locked.has(j) && kindOf(id) === k);
      if (i < 0) {
        const free = p.hand.findIndex((id, j) => !locked.has(j) && !want.includes(kindOf(id)));
        const slot = free >= 0 ? free : p.hand.findIndex((id, j) => !locked.has(j));

        pools.push(this.dead);
        for (const pool of pools) {
          const w = pool.findIndex((id, x) => kindOf(id) === k && !(pool === this.dead && (x === this.doraBase || x === this.doraBase + 1)));   // 이미 뒤집은 도라 표시패 자리는 건드리지 않는다
          if (w >= 0) { const t = pool[w]; pool[w] = p.hand[slot]; p.hand[slot] = t; i = slot; break; }

    return this.players[s].hand.some(id => kindOf(id) === 30);
  }
  doNuki(s, prefer) {

    let i = prefer != null ? p.hand.indexOf(prefer) : -1;
    if (i < 0) i = p.hand.findIndex(id => kindOf(id) === 30);
    const id = p.hand.splice(i, 1)[0];
    p.nuki.push(id);
    this.anyCall = true;   // 북 빼기도 울기처럼 첫 순을 끊는다: 이후 구종구패·더블 리치·천화/지화 불가, 일발도 사라진다
    for (const q of this.players) q.ippatsu = false;
    this.drawn = null;
    this.updateWaits(p);

  }
  updateWaits(p) {
    const c = countsOf(p.hand);
    p.waits = (p.hand.length % 3 === 1) ? waitsOf(c, p.melds.length) : [];
  }
  canKyuushu(s) {
    const p = this.players[s];
    if (this.anyCall || p.discards.length) return false;
    const c = countsOf(p.hand);

    this.scores[order[0]] += this.kyotaku * 1000;
    this.kyotaku = 0;

    order.forEach((s, i) => { ranks[s] = i + 1; });

    return { scores: this.scores.slice(), ranks, order, decisions: n, matches: m, rate: n ? m / n : 0, stats };
  }
}

// ---------- 울기·깡·리치 판단 (힌트와 CPU가 같이 씀) ----------
const krName = k => k >= 27 ? HONOR_CH[k - 27] : (k % 9 + 1) + ['만', '통', '삭'][Math.floor(k / 9)];
function bestAfterDiscard(c, mc) {
  let b = 9;
  for (let k = 0; k < 34; k++) { if (!c[k]) continue; c[k]--; b = Math.min(b, shanten(c, mc)); c[k]++; }
  return b;
}
// 울고 난 손에 역이 생길 길이 있는지
function yakuPath(g, s, c, melds) {
  const yak = k => isDragon(k) || k === g.seatWind(s) || k === g.roundWind();
  const setKinds = melds.filter(m => m.type !== 'chi').map(m => m.k);
  if (setKinds.some(yak)) return '역패';
  const allMeld = melds.flatMap(m => m.type === 'chi' ? [m.k, m.k + 1, m.k + 2] : [m.k]);
  let handYao = 0, n = 0;
  for (let k = 0; k < 34; k++) { n += c[k]; if (isYaochu(k)) handYao += c[k]; }
  if (allMeld.every(k => !isYaochu(k)) && handYao <= 1) return '탕야오';
  for (let st = 0; st < 3; st++) {
    const inSuit = k => k >= 27 || Math.floor(k / 9) === st;
    if (!allMeld.every(inSuit)) continue;
    let off = 0;
    for (let k = 0; k < 34; k++) if (!inSuit(k)) off += c[k];
    if (off <= 2) return '혼일색';
  }
  if (melds.every(m => m.type !== 'chi')) {
    let pairs = 0;
    for (let k = 0; k < 34; k++) if (c[k] >= 2) pairs++;
    if (pairs >= 5 - melds.length) return '또이또이';

function tile(k, o){
  o = o || {};
  const red = o.id != null && (UI.screen === 'game' || UI.screen === 'review' ? UI.aka !== false : settings.aka) && isRedId(o.id);
  const key = (o.id === MJ.SHIRO_ID && NP === 3 && UI.screen === 'game') ? '31s' : red ? k + 'r' : k;
  return `<span class="tile ${o.size||'sm'} ${o.cls||''}" data-k="${k}" ${o.attrs||''}><svg viewBox="0 0 60 80" aria-hidden="true"><use href="#f${key}"/></svg></span>`;
}
const tileId = (id, o) => { o = Object.assign({id}, o||{}); if(!o.nofk) o.attrs = `data-fk="h${id}" ` + (o.attrs || ''); return tile(kindOf(id), o); };
const backTile = size => `<span class="tile ${size||'sm'} facedown"></span>`;
// 울은 패 놓는 법: 가져온 패를 옆으로 눕히고, 눕힌 위치로 누구에게서 가져왔는지 나타낸다
//  상가(왼쪽)에서 → 왼쪽 끝, 대면에서 → 가운데, 하가(오른쪽)에서 → 오른쪽 끝. 치는 항상 상가라 왼쪽 끝.
//  가깡은 눕힌 패 위에 한 장 더 눕혀 쌓고, 안깡은 양끝을 엎어 둔다. 3인은 대면이 없어 하가·상가 두 경우뿐.
//  한 멘쯔는 세로·가로 구분 없이 틈 없이 붙인다.
function meldParts(m, owner){
  const list = (m.ids || m.ks).slice();
  if(m.type === 'ankan') return [{x:list[0], back:true}, {x:list[1]}, {x:list[2]}, {x:list[3], back:true}];
  if(m.called == null || m.from == null || owner == null) return list.map(x => ({x}));
  // 퐁·깡은 앉은 자리 순서(상가/하가)가 아니라 실제 화면상 방향으로 정한다.
  //  3인은 위쪽이 비어 있어 CPU 둘끼리는 논리상 상가/하가여도 화면에서는 마주 보고 있다 → 대면(가운데)
  const relT = (VS(m.from) - VS(owner) + 4) % 4;
  const rel = relT === 1 ? 1 : relT === 3 ? 3 : 2;   // 1 하가(오른쪽) · 2 대면 · 3 상가(왼쪽)
  const rest = list.slice();
  const ci = rest.indexOf(m.called); if(ci >= 0) rest.splice(ci, 1);
  if(m.type === 'chi'){ rest.sort((a, b) => a - b); return [{x:m.called, side:true}, ...rest.map(x => ({x}))]; }
  let side = {x:m.called, side:true};
  let up = rest;
  if(m.type === 'kakan'){ const added = rest.pop(); side = {x:m.called, side:true, stack:added}; }
  const pos = rel === 3 ? 0 : rel === 2 ? 1 : up.length;
  const parts = up.map(x => ({x}));
  parts.splice(pos, 0, side);
  return parts;
}
function meldHTML(m, size, cls, owner){
  size = size || 'sm';
  const one = (x, extra) => m.ids ? tileId(x, {size, cls:extra}) : tile(x, {size, cls:extra});
  const list0 = m.ids || m.ks || [];
  const mattr = `data-mt="${m.type}" data-mk="${m.ids ? kindOf(list0[0]) : list0[0]}"`;
  if(UI.claim && UI.claim.m === m){   // 울었지만 아직 타패 전: 꺼내 보인 패만 세로로, 가져올 패는 아직 상대 강에
    return `<span class="${cls||'meld'}" ${mattr}>${list0.filter(x => x !== m.called).map(x => one(x)).join('')}</span>`;
  }
  const inner = meldParts(m, owner).map(p => {
    if(p.back) return backTile(size);
    if(p.side && p.stack != null) return `<span class="kst">${one(p.x, 'yoko')}${one(p.stack, 'yoko up')}</span>`;   // 가깡: 눕힌 패 바로 위에 붙여 쌓기
    if(p.side) return one(p.x, 'yoko');
    return one(p.x);
  }).join('');
  return `<span class="${cls||'meld'}" ${mattr}>${inner}</span>`;
}

function flipCapture(){
  const m = new Map();
  if(UI.screen !== 'game') return m;
  $app.querySelectorAll('[data-fk]').forEach(el => { const r = el.getBoundingClientRect(); if(r.width) m.set(el.dataset.fk, {x: r.left + r.width/2, y: r.top + r.height/2}); });
  if(UI.flipFrom){ m.set(UI.flipFrom.key, UI.flipFrom.pt); UI.flipFrom = null; }
  if(UI.flipMany){ UI.flipMany.keys.forEach(k => m.set(k, Object.assign({dur: UI.flipMany.dur}, UI.flipMany.pt))); UI.flipMany = null; }
  return m;
}
function flipPlay(m){
  if(!m.size || UI.screen !== 'game' || UI.noFlip) return;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  $app.querySelectorAll('[data-fk]').forEach(el => {
    const o = m.get(el.dataset.fk); if(!o) return;
    const r = el.getBoundingClientRect(); if(!r.width) return;
    const dx = o.x - (r.left + r.width/2), dy = o.y - (r.top + r.height/2);
    if(Math.abs(dx) < .5 && Math.abs(dy) < .5) return;
    const ly = el.closest('.layer'), th = (ly ? +ly.dataset.rot || 0 : 0) * Math.PI / 180;
    const lx = dx * Math.cos(th) + dy * Math.sin(th), lyy = -dx * Math.sin(th) + dy * Math.cos(th);
    const far = Math.hypot(dx, dy) > 60;
    try{ el.animate([{translate:`${lx}px ${lyy}px`, zIndex:40}, {translate:'0px 0px', zIndex:40}], o.dur ? {duration: o.dur, easing:'cubic-bezier(.35,.1,.3,1)'} : {duration: far ? 230 : 160, easing:'cubic-bezier(.2,.75,.3,1)'}); }catch(e){}
  });
}

// ---------- 효과음 (Web Audio로 합성, 파일 없음) ----------
const SFX = (() => {
  let ctx = null, base = 0;   // base: 지금부터 몇 초 뒤에 낼지(오디오 시계로 정확히 예약)
  const ac = () => {
    if(settings.sound === false) return null;
    if(!ctx){ try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    return ctx;
  };
  function noise(dur, freq, q, gain, delay){
    const c = ac(); if(!c) return;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/len, 4);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(c.currentTime + base + (delay || 0));
  }
  function tone(freq, dur, gain, type, delay){
    const c = ac(); if(!c) return;
    const t0 = c.currentTime + base + (delay || 0);
    const o = c.createOscillator(); o.type = type || 'sine'; o.frequency.value = freq;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  // 딱! 패가 나무 탁자에 부딪히는 소리: 아주 짧은 잡음 충격을 나무 공명(비정수배 대역)에 통과시킨다
  // 순수한 사인파를 쓰지 않아 '띠' 하는 음높이가 생기지 않는다
  const clacks = {};
  function bandpass(x, sr, f, q){
    const w = 2 * Math.PI * f / sr, al = Math.sin(w) / (2 * q), cw = Math.cos(w);
    const b0 = al, b2 = -al, a0 = 1 + al, a1 = -2 * cw, a2 = 1 - al;
    const y = new Float32Array(x.length);
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for(let i = 0; i < x.length; i++){
      const v = (b0 * x[i] + b2 * x2 - a1 * y1 - a2 * y2) / a0;
      x2 = x1; x1 = x[i]; y2 = y1; y1 = v; y[i] = v;
    }
    return y;
  }
  function clackBuffer(c, kind, variant){
    const key = kind + variant;
    if(clacks[key]) return clacks[key];
    const sr = c.sampleRate, len = Math.floor(sr * 0.06);
    let seed = 7 + variant * 4099;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647 * 2 - 1; };
    // 넓적한 패가 탁자를 치는 접촉: 짧은 반 사인 힘 + 납작한 면이 공기를 때리는 잡음
    const ex = new Float32Array(len);
    const pw = kind === 'draw' ? 0.0003 : 0.0007, nt = kind === 'draw' ? 0.0008 : 0.0016;
    for(let i = 0; i < len; i++){
      const t = i / sr;
      const pulse = t < pw ? Math.sin(Math.PI * t / pw) : 0;
      ex[i] = pulse * 1.2 + rnd() * Math.exp(-t / nt) * 0.7;
    }
    const sc = 1;
    const modes = kind === 'draw'
      ? [[2600, 4, .7], [4200, 4, .5]]
      : [[230, 4, .9], [420, 4, .75], [880, 3, .85], [1650, 3, .8], [2900, 3, .5]];   // 탁자 판의 묵직한 울림 + 패의 딱
    const out = new Float32Array(len);
    for(const [f, q, amp] of modes){ const y = bandpass(ex, sr, f * sc, q); for(let i = 0; i < len; i++) out[i] += y[i] * amp; }
    for(let i = 0; i < len; i++){ const t = i / sr; out[i] *= t < 0.025 ? 1 : Math.exp(-(t - 0.025) / 0.004); }
    let peak = 0; for(let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(out[i]));
    const buf = c.createBuffer(1, len, sr), d = buf.getChannelData(0);
    const drive = kind === 'draw' ? 1 : 2.6, nrm = Math.tanh(drive);
    for(let i = 0; i < len; i++) d[i] = Math.tanh(out[i] / peak * drive) / nrm * 0.95;   // 살짝 눌러서 더 크고 단단하게
    return (clacks[key] = buf);
  }
  // 음높이가 미끄러지는 소리(첨벙·휙)
  function blip(f0, f1, dur, gain, delay, type){
    const c = ac(); if(!c) return;
    const t0 = c.currentTime + base + (delay || 0);
    const o = c.createOscillator(); o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  let vi = 0;
  function clack(kind, gain){
    const c = ac(); if(!c) return;
    const src = c.createBufferSource(); src.buffer = clackBuffer(c, kind, 0);
    const g = c.createGain(); g.gain.value = gain;
    src.connect(g); g.connect(c.destination); src.start(c.currentTime + base);
  }
  const api = {
    unlock: ac,
    now(){ const c = ac(); return c ? c.currentTime : null; },   // 오디오 시계(초). 소리가 꺼져 있으면 null
    draw(){ clack('draw', .28); },                                         // 패 집는 소리
    discard(){ clack('discard', 1.0); },                                   // 딱! 내려놓는 소리
    call(){ clack('discard', .6); tone(587, .12, .16, 'triangle', .02); tone(784, .18, .16, 'triangle', .1); },
    riichi(){ tone(523, .12, .18, 'square', 0); tone(784, .3, .16, 'square', .11); },
    dice(){ const c = ac(); if(!c) return; [0,.07,.15,.26].forEach((d,i) => setTimeout(() => clack('draw', .5 - i*.08), d*1000)); },
    win(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, .4, .16, 'triangle', i * .09)); },
    // ---- RPG 행동 효과음(짧게) ----
    combat(){ noise(.11, 2600, 1.2, .25, 0); noise(.16, 1300, .8, .16, .05); clack('discard', .17); blip(190, 65, .12, .08, .07, 'sawtooth'); },   // 휙! 베고 퍽 (피치 낮추고 음량 절반)   // 휙! 베고 퍽
    wood(){ blip(170, 70, .16, .38, 0, 'triangle'); noise(.08, 750, 1.4, .5, 0); clack('discard', .8); noise(.05, 2600, 2, .18, .06); },       // 퍽! 도끼가 나무에 박힘
    mine(){ noise(.04, 3200, 2, .55, 0); tone(1760, .2, .13, 'triangle', .005); tone(2637, .13, .07, 'sine', .015); clack('discard', .4); },       // 쨍! 곡괭이가 바위를 침
    fish(){ noise(.26, 900, .7, .42, 0); noise(.2, 2400, 1, .22, .05); blip(620, 300, .14, .12, .02, 'sine'); blip(820, 420, .1, .08, .12, 'sine'); }, // 첨벙
    lvup(){ [659, 784, 988, 1319].forEach((f, i) => tone(f, .28, .14, 'triangle', .12 + i * .08)); },
    // ---- 마작 스킬 ----
    skFail(){   // 치익~ 달군 쇠를 물에 담그는 소리: 높은 쉬익 잡음이 서서히 잦아들고, 끝에 작은 보글
      const c = ac(); if(!c) return;
      const t0 = c.currentTime + base, dur = .55, len = Math.floor(c.sampleRate * dur);
      const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for(let i = 0; i < len; i++){ const x = i / len; d[i] = (Math.random() * 2 - 1) * (x < .04 ? x / .04 : Math.pow(1 - (x - .04) / .96, 1.6)) * (.75 + .25 * Math.random()); }
      const src = c.createBufferSource(); src.buffer = buf;
      const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.setValueAtTime(4200, t0); hp.frequency.exponentialRampToValueAtTime(1800, t0 + dur);
      const bp = c.createBiquadFilter(); bp.type = 'peaking'; bp.frequency.value = 6500; bp.gain.value = 6;
      const g = c.createGain(); g.gain.value = .32;
      src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(c.destination); src.start(t0);

const BGM_ENV = {   // [분위기, 바탕 소리, 이따금 나는 소리들] — 행동별 9단계
  combat: [['calm','breeze',['bird']], ['calm','breeze',['bird']], ['calm','marsh',['frog','drop']], ['calm','wind',[]], ['calm','wind',[]],
           ['dark','wind',['drop','bell']], ['dark','rumble',['crackle']], ['dark','wind',['bell']], ['dark','rumble',['crackle']], ['dark','deep',['chime']]],
  wood:   [['calm','breeze',['bird']], ['calm','breeze',['bird']], ['calm','breeze',['bird','owl']], ['calm','breeze',['bird']], ['calm','breeze',['bird','insect']],
           ['calm','wind',['owl']], ['calm','breeze',['bird','owl']], ['dark','none',['chime']], ['calm','breeze',['bird','chime']], ['dark','deep',['chime']]],
  mine:   [['calm','cave',['drop']], ['calm','cave',['drop']], ['calm','cave',['drop']], ['calm','cave',['drop','chime']], ['calm','cave',['drop','chime']],

  fish:   [['calm','brook',['bird']], ['calm','lake',['bird']], ['calm','brook',['bird']], ['calm','waves',['bird']], ['dark','deep',['bubble']],

const BGM = (() => {
  let cur = null;   // { key, master, nodes, timers, chordIdx }
  const CHORDS = {
    calm: [[130.81, 196.00, 329.63], [110.00, 164.81, 261.63], [87.31, 174.61, 261.63], [98.00, 146.83, 246.94]],   // C · Am · F · G
    dark: [[110.00, 164.81, 220.00], [87.31, 130.81, 207.65], [82.41, 123.47, 196.00], [98.00, 146.83, 233.08]]
  };
  let brown = null;
  function brownBuf(c){
    if(brown) return brown;
    const len = c.sampleRate * 4, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    let last = 0; for(let i = 0; i < len; i++){ last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; }
    return (brown = b);
  }

  // 바탕 소리: 갈색 잡음 반복 + 필터 + 아주 느린 숨결(LFO)
  function bed(o, type){
    const c = o.c, P = {
      breeze:[ 'bandpass', 420, .7, .035, .015, 11], wind:[ 'bandpass', 520, .9, .05, .022, 13], cave:[ 'lowpass', 160, .7, .045, .01, 17],
      brook:[ 'bandpass', 1300, .6, .08, .03, 3.2], lake:[ 'lowpass', 520, .7, .10, .05, 9], waves:[ 'lowpass', 650, .7, .14, .10, 10],
      rain:[ 'highpass', 1400, .6, .07, .015, 7], rumble:[ 'lowpass', 95, .8, .09, .02, 15], deep:[ 'lowpass', 130, .8, .075, .025, 14], marsh:[ 'lowpass', 380, .7, .08, .03, 12]

    if(!P) return;
    const src = c.createBufferSource(); src.buffer = brownBuf(c); src.loop = true;
    const f = c.createBiquadFilter(); f.type = P[0]; f.frequency.value = P[1]; f.Q.value = P[2];
    const g = c.createGain(); g.gain.value = P[3];
    const lfo = c.createOscillator(); lfo.frequency.value = 1 / P[5];
    const lg = c.createGain(); lg.gain.value = P[4];
    lfo.connect(lg); lg.connect(g.gain);
    if(type === 'wind'){ const l2 = c.createOscillator(); l2.frequency.value = 1 / 19; const g2 = c.createGain(); g2.gain.value = 160; l2.connect(g2); g2.connect(f.frequency); l2.start(); o.nodes.push(l2); }

  function pad(o){
    const c = o.c, ch = CHORDS[o.mood][o.chordIdx++ % 4], t0 = c.currentTime;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = o.mood === 'dark' ? 600 : 900;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(1, t0 + 6); g.gain.setValueAtTime(1, t0 + 18); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 25);
    lp.connect(g); g.connect(o.master);
    ch.forEach((f, i) => [0, 1.8].forEach(det => {

  }

  const EV = {
    bird(o, t){ const n = 2 + Math.floor(Math.random() * 3), base = 2600 + Math.random() * 1200;
      for(let i = 0; i < n; i++) sweep(o, base, base * (1.3 + Math.random() * .3), .07, .018, t + i * (.12 + Math.random() * .06)); },
    owl(o, t){ [0, .55].forEach((d, i) => sweep(o, 390 - i * 20, 350 - i * 20, .45, .03, t + d, 'sine', .12)); },
    insect(o, t){ for(let i = 0; i < 8; i++) sweep(o, 4600, 4500, .035, .006, t + i * .06); },
    drop(o, t){ const f = 900 + Math.random() * 700; sweep(o, f, f * .45, .14, .035, t, 'sine', .004); sweep(o, f * .9, f * .4, .14, .012, t + .23, 'sine', .004); sweep(o, f * .85, f * .4, .14, .005, t + .46, 'sine', .004); },
    chime(o, t){ const notes = [1318.5, 1568, 1760, 2093, 2349]; for(let i = 0; i < 2; i++) ring(o, notes[Math.floor(Math.random() * notes.length)], 2.4, .012, t + i * .4); },
    crackle(o, t){ for(let i = 0; i < 6; i++) click(o, t + Math.random() * 1.2, .02); },
    frog(o, t){ for(let i = 0; i < 2; i++) croak(o, t + i * .35); },
    bubble(o, t){ for(let i = 0; i < 3; i++) sweep(o, 280 + Math.random() * 80, 640, .08, .02, t + i * .13, 'sine', .01); },
    bell(o, t){ ring(o, 196, 5, .025, t); ring(o, 196 * 2.76, 3, .008, t); ring(o, 196 * 5.4, 2, .004, t); }
  };
  function sweep(o, f0, f1, dur, gain, t, type, att){
    const c = o.c, os = c.createOscillator(); os.type = type || 'sine';
    os.frequency.setValueAtTime(f0, t); os.frequency.exponentialRampToValueAtTime(f1, t + dur);

  }
  function ring(o, f, dur, gain, t){

    for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = c.createBufferSource(); src.buffer = b; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800 + Math.random() * 1500;
    const g = c.createGain(); g.gain.value = gain; src.connect(f); f.connect(g); g.connect(o.fx); src.start(t);
  }
  function croak(o, t){
    const c = o.c, os = c.createOscillator(); os.type = 'sawtooth'; os.frequency.value = 120;
    const am = c.createOscillator(); am.frequency.value = 28; const amg = c.createGain(); amg.gain.value = .5;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.018, t + .03); g.gain.exponentialRampToValueAtTime(0.0001, t + .26);

    sync(){   // 화면이 바뀔 때마다 부른다: RPG 화면이고 소리·BGM이 켜져 있으면 지금 던전의 BGM

})();

function ask(p){

      const id = UI.game.drawn.id;
      setTimeout(() => { const q = UI.pending; if(!q || q.kind !== 'action') return; if(q.ctx.riichiOptions.includes(kindOf(id))){ setRiichiDiscard(id); } else choose({type:'discard', id, riichi:false}); }, 0);
    }
    UI.pending = Object.assign(p, {resolve: v => { if(t !== UI.token) return; UI.pending = null; UI.confirm = null; UI.sel = null; UI.riichiMode = false; UI.riichiDiscard = null; UI.callPick = false; if(UI.callStage && UI.callStage.timer) clearTimeout(UI.callStage.timer); UI.callStage = null; res(v); render(); }});

// 내 쯔모: 뽑은 패는 패산에 그대로 보이고, 그 패(또는 손패 빈자리)를 눌러야 손으로 날아온다
function takeDraw(){
  const pd = UI.pendingDraw;

  return pd.wait || (pd.wait = new Promise(res => { pd.resolve = res; }));
}
function flyIn(dropAt){
  const pd = UI.pendingDraw;
  if(!pd || pd.flying) return;
  const src = document.querySelector('.wnext') || document.querySelector('.hand .tile.slot');
  const slot = document.querySelector('.hand .tile.slot');
  if(!src || !slot){ if(pd.rinshan && UI.drill) UI.drillRinshan = true; UI.pendingDraw = null; render(); pd.resolve && pd.resolve(); return; }
  const to = slot.getBoundingClientRect();
  const from = dropAt ? {left: dropAt.x - to.width/2, top: dropAt.y - to.height/2, width: to.width, height: to.height} : src.getBoundingClientRect();
  pd.flying = true; draw();
  const fly = document.createElement('div');
  fly.className = 'flytile';
  fly.style.cssText = `position:fixed;left:${to.left}px;top:${to.top}px;width:${to.width}px;height:${to.height}px;z-index:50;pointer-events:none;--hw:${to.width}px`;
  fly.innerHTML = tileId(pd.id, {size:'lg', nofk:true, cls: UI.inv && UI.inv.has(pd.id) ? 'inv' : ''});
  document.body.appendChild(fly);
  const sc = Math.max(.3, from.width / to.width);
  const dx = from.left + from.width/2 - (to.left + to.width/2), dy = from.top + from.height/2 - (to.top + to.height/2);
  const done = () => { fly.remove(); if(pd.rinshan && UI.drill) UI.drillRinshan = true; if(UI.pendingDraw === pd){ UI.pendingDraw = null; SFX.draw(); render(); } pd.resolve && pd.resolve(); };
  try{
    const an = fly.animate([{transform:`translate(${dx}px,${dy}px) scale(${sc})`, opacity:.85},{transform:'none', opacity:1}], {duration:240, easing:'cubic-bezier(.2,.7,.3,1)'});
    an.onfinish = done; an.oncancel = done;
  }catch(e){ done(); }
}

function sticksOf(score){

  let T = Math.floor(score / 1000), rem = score % 1000, g = 0, w = 0;
  if(rem === 0 && T >= 2){ T -= 1; g = 1; w = 5; }          // 천 점 하나는 잔돈(초록1+하양5)으로
  else { g = rem >= 500 ? 1 : 0; w = (rem % 500) / 100; }

  const rest = T - r * 10;
  const y = Math.max(0, Math.floor((rest - 1) / 5));
  return {r, y, b: rest - y * 5, g, w};

// ---------- 패산·왕패 ----------
// 고리 순서: 나 → 상가 → 대면 → 하가 (시계 방향), 각 벽은 그 사람 기준 오른쪽 끝에서 왼쪽으로
// 4인: 17줄×4벽, 3인: 18줄×3벽(위쪽 대면 자리는 비어 있다)
const wallK = n => n === 3 ? 18 : 17;
const fullWalls = n => seatsBy(n).map(() => Array.from({length: wallK(n)}, () => ({t:true, b:true, dora:null, dead:false})));
function wallLayout(o){
  const N = o.N || 4, K = wallK(N), TS = N * K, RING = N === 3 ? [0, 2, 1] : [0, 3, 2, 1];
  const P3 = N === 3, DEADN = P3 ? 10 : 14, RS = P3 ? 4 : 2;   // 3인 왕패: 영상패 4줄 + 도라 1줄 (깡도라는 산패 꽁무니에서 넘겨받음)
  const LIVE = TS * 2 - DEADN, HALF = LIVE / 2;
  const KD = P3 ? Math.max(0, (o.dora || []).length - 1) : 0;   // 3인: 산패에서 넘어간 깡도라 줄 수
  const slots = seatsBy(N).map(() => Array.from({length:K}, () => ({t:false, b:false, dora:null, dead:false})));
  const pos = a => { a = ((a % TS) + TS) % TS; return { seat: RING[Math.floor(a/K)], j: K - 1 - (a % K) }; };
  const wseat = (o.dealer + o.dice - 1) % N;
  const a0 = RING.indexOf(wseat) * K + o.dice;          // 벽을 가른 자리 바로 다음부터 뽑는다
  const R = o.rinshan || 0;
  const TAILN = P3 ? 2 * KD : R;                           // 꽁무니에서 빠진 장수: 4인은 영상패 보충, 3인은 깡도라 줄
  const F = LIVE - o.left - TAILN;                          // 앞에서 뽑아 간 장수 (배패 포함)
  // 배패 마지막 바퀴(ちょんちょん)는 앞에서부터 차례로가 아니라 건너뛰며 집으므로, 집어 간 자리를 따로 받는다
  const DL = o.deal;
  const takenAt = DL && DL.base != null ? (i => i < DL.base || DL.taken.includes(i - DL.base)) : (i => i < F);
  for(let st = 0; st < HALF; st++){
    let top = !takenAt(2*st), bot = !takenAt(2*st + 1);
    const {seat, j} = pos(a0 + st);
    if(P3 && st >= HALF - KD){   // 3인: 깡도라로 넘어간 꽁무니 줄은 왕패가 된다
      const sl = slots[seat][j], i = 1 + (HALF - 1 - st);
      sl.dead = true; sl.t = true; sl.b = true; if(i < o.dora.length){ sl.dora = o.dora[i]; sl.dIdx = i; if(o.doraIds) sl.doraId = o.doraIds[i]; if(o.ura && o.ura[i] != null){ sl.ura = o.ura[i]; sl.uraAt = o.uraAt[i]; sl.b = false; } }
      continue;
    }
    if(!P3) for(let k = 0; k < R; k++){ if(HALF - 1 - (k >> 1) === st){ if(k % 2 === 0) top = false; else bot = false; } }   // 깡 보충으로 끝에서 빠진 패
    slots[seat][j].t = top; slots[seat][j].b = bot; slots[seat][j].wi = st;
    if(o.peek && (o.peek.i >> 1) === st && (o.peek.i % 2 === 0 ? top : bot)) slots[seat][j].pk = Object.assign({ lower: o.peek.i % 2 === 1 }, o.peek);   // 입질: 내가 다음에 뽑을 패(윗패/아랫패)   // 패산 순번(앞에서부터): 윗패 2st, 아랫패 2st+1
    if(o.next === 'live' && st === (F >> 1)) slots[seat][j].nx = (F % 2 === 0) ? 't' : 'b';
    if(P3 && o.alice){   // 아리스: 패산 꽁무니(깡도라 다음 줄)부터 한 줄씩 윗패를 뒤집어 보인다
      const aj = HALF - KD - 1 - st;
      if(aj >= 0 && aj < o.alice.flips.length){
        const sl = slots[seat][j];
        sl.t = true; sl.b = true; sl.dora = kindOf(o.alice.flips[aj].id); sl.doraId = o.alice.flips[aj].id;
        if(aj === o.alice.flips.length - 1){ sl.afl = o.alice.age; if(o.alice.blink) { sl.hl = true; sl.ablk = true; } }
      }
    }
  }
  if(DL && DL.next){ for(const i of DL.next){ const {seat, j} = pos(a0 + (i >> 1)); const sl = slots[seat][j]; sl.dn = true; if(i % 2 === 0) sl.dnt = true; else sl.dnb = true; } }   // 배패: 내가 집을 패
  for(let q = 0; q < DEADN / 2; q++){                      // 왕패: 갈라진 자리 쪽이 영상패(4인 2줄 · 3인 4줄), 그 다음이 도라 표시패
    const {seat, j} = pos(a0 - 1 - q);
    const sl = slots[seat][j];
    sl.dead = true; sl.t = true; sl.b = true;
    if(P3){   // 3인: 내려 두는 패 없이 끝 줄 윗패 → 아랫패 → 다음 줄 순으로 영상패
      if(q < RS){ sl.t = R < 2*q + 1; sl.b = R < 2*q + 2; if(o.next === 'rinshan' && (R >> 1) === q) sl.nx = R % 2 === 0 ? 't' : 'b'; }
      else if(o.dora && o.dora.length){ sl.dora = o.dora[0]; if(o.doraIds) sl.doraId = o.doraIds[0]; if(o.ura && o.ura[0] != null){ sl.ura = o.ura[0]; sl.uraAt = o.uraAt[0]; sl.b = false; } sl.dIdx = 0; }
      continue;
    }
    // 영상패: 끝 줄의 윗패는 옆에 내려 두고 그것부터 뽑는다 → 내린 패, 끝 줄 아랫패, 다음 줄 윗패, 다음 줄 아랫패 순
    if(q === 0){ sl.drop = R < 1; sl.t = false; sl.b = R < 2; }
    else if(q === 1){ sl.t = R < 3; sl.b = R < 4; }
    if(o.next === 'rinshan'){

const CALLNAME = c => !c ? '넘기기' : c.type === 'pon' ? '퐁' : c.type === 'minkan' ? '깡' : c.type === 'chi' ? '치' : c.type === 'ankan' ? '안깡 ' + kname(c.k) : c.type === 'kakan' ? '가깡 ' + kname(c.k) : '';
function sameChoice(a, b){
  if(!a || !b) return !a && !b;
  if(a.type !== b.type) return false;
  if(a.type === 'chi') return a.kinds[0] === b.kinds[0] && a.kinds[1] === b.kinds[1];
  if(a.k != null || b.k != null) return a.k === b.k;
  return true;
}
// 사용자가 고른 값을 바로 넘기지 않고, 힌트 모드면 확인 창을 띄운다

    ai = `${kname(rec.best.kind)} 버리기${rh && rh.riichi?' + 리치':''} — ${shTxt(rec.best.sh)}, 유효패 ${rec.best.uke}장${rec.threat?', 위험도 '+rec.best.danger:''}`;
    aiTile = rec.best.kind;

    const rMatch = !rh || !!value.riichi === !!rh.riichi;

    const d = { me:{k, sh:mc.sh, uke:mc.uke, danger:mc.danger}, ai:{k:rec.best.kind, sh:rec.best.sh, uke:rec.best.uke, danger:rec.best.danger}, mode:rec.mode, match:dMatch };
    why = [dMatch ? '' : whyText(d), rh && !rMatch ? rh.reason : '', pd.ctx.tsumo ? '쯔모로 화료할 수 있어요!' : '', kh && kh.choice ? kh.reason : ''].filter(Boolean).join(' ');
  } else if(pd.kind === 'action'){            // 깡·구종구패
    if(value.type === 'kyuushu'){
      const c = MJ.countsOf(g.players[0].hand); const n = [0,8,9,17,18,26,27,28,29,30,31,32,33].filter(x => c[x]).length;
      const aiYes = n < 11; mine = '구종구패 유국'; ai = aiYes ? '구종구패 유국' : '계속 진행 (국사무쌍 노리기)'; match = aiYes; why = aiYes ? '' : `요구패가 ${n}종류라 국사무쌍을 노려볼 만해요.`;
    } else {
      const kh = adviseSelfKan(g, 0, pd.ctx.kanOptions);

  } else if(pd.kind === 'ron' || pd.kind === 'tsumo'){

const passBtn = () => settings.phone ? '<button class="btn" data-act="no">넘기기</button>' : '<span class="btn rcguide" aria-label="넘기려면 우클릭">우클릭</span>';
// 폰 모드: 패를 누르면 바로 버리고, 리치할 수 있는 패는 한 번 눌러 들어 올린 뒤 [리치]나 한 번 더 눌러 다마
function phoneTap(id){
  const pd = UI.pending;
  if(!pd || pd.kind !== 'action' || UI.confirm) return;
  if(UI.pruneMode && pruneReady()){ doPrune(id); return; }   // 바꿔치기: 고른 패를 패산의 패와 바꾼다
  const me = UI.game.players[0], k = kindOf(id), fb = pd.ctx.forbidden;
  if(fb && fb.includes(k) && me.hand.some(x => !fb.includes(kindOf(x)))) return;
  if(pd.ctx.riichiOptions.includes(k) && UI.sel !== id){ UI.sel = id; render(); return; }
  choose({type:'discard', id, riichi:false});
}
// 리치 선언패를 가로로 눕힌 순간: 그 패로 누가 론하면 점봉을 낼 틈 없이 바로 방총(리치는 성립하지 않아 공탁도 없다)
function setRiichiDiscard(id){
  const g = UI.game;
  if(g && g.seats.some(o => o !== 0 && g.checkRon(o, id, false))){ UI.riichiDiscard = null; choose({type:'discard', id, riichi:true}); return; }
  UI.riichiDiscard = id; UI.hoverDiscard = null;
  render();
}
function onTile(id){
  const pd = UI.pending;
  if(!pd || pd.kind !== 'action' || UI.confirm) return;
  const me = UI.game.players[0], k = kindOf(id);
  if(UI.riichiMode && !pd.ctx.riichiOptions.includes(k)) return;
  const fb = pd.ctx.forbidden;
  if(!UI.riichiMode && fb && fb.includes(k) && me.hand.some(x => !fb.includes(kindOf(x)))) return;
  if(UI.riichiDiscard != null){                       // 리치 대기 중: 다른 텐파이 타패로 바꾸기만
    if(pd.ctx.riichiOptions.includes(k)) setRiichiDiscard(id);
    return;
  }
  if(pd.ctx.riichiOptions.includes(k)){ setRiichiDiscard(id); return; }   // 텐파이 타패: 리치/다마를 정할 때까지 옆으로 눕혀 둔다
  if(settings.oneTap || UI.sel === id) return choose({type:'discard', id, riichi:false});
  UI.sel = id; render();
}

// 축의칩: 내가 화료하면 적도라 + 뒷도라(리치) + 일발 1개
function chipsOfWin(w, res){
  const y = (w.res && w.res.yaku) || [];
  const get = nm => { const e = y.find(x => x[0] === nm); return e && typeof e[1] === 'number' ? e[1] : 0; };
  let aka = get('적도라'), ura = get('뒷도라');
  const ipp = y.some(x => x[0] === '일발') ? 1 : 0;
  if(w.res && w.res.yakuman){   // 역만은 도라를 세지 않으므로 적도라는 패에서 직접 센다
    const ids = w.hand.concat([w.winTile], ...w.melds.map(m => m.ids));
    aka = ids.filter(id => isRedId(id)).length;
  }
  const parts = [];
  if(aka) parts.push(`적도라 ${aka}`); if(ura) parts.push(`뒷도라 ${ura}`); if(ipp) parts.push('일발 1');
  let n = aka + ura + ipp;
  const r = w.res;
  if(r && r.yakuman){ const ym = 5 * r.yakuman; n += ym; parts.push(`역만 ${ym}`); }
  else if(r && r.label === '헤아림 역만'){ n += 5; parts.push('헤아림 역만 5'); }   // 13판 이상도 역만 1개로   // 역만 1개당 5장 (더블 10, 트리플 15, 복합은 개수대로)
  if(res && !res.tsumo && res.scores && w.deltas.some((d, i) => i !== w.winner && d < 0 && res.scores[i] < 0)){ n += 1; parts.push('토비 1'); }   // 론으로 상대를 0점 미만으로
  if(w.shiro){ n += 1; parts.push('시로폿치 1'); }
  return { n, parts };
}
// 아리스(3인 전용): 멘젠(리치 포함) 화료 후 다음 깡도라 표시패 자리부터 차례로 뒤집는다.
//  뒤집은 패가 내 패에 있으면 가진 장수만큼(안커 3장이면 +3, 안깡이면 +4) 축의를 받고 다음 자리로, 없으면 끝.
//  3인 깡도라는 패산 꽁무니 줄을 넘겨받으므로 자리는 패산 꽁무니부터 줄마다 윗패 → 패산이 다할 때까지.
function aliceOf(w, g){
  if(!g || g.N !== 3 || settings.alice !== true) return null;
  if(!w.melds.every(m => m.type === 'ankan')) return null;   // 멘젠만
  const mine = w.hand.concat([w.winTile], ...w.melds.map(m => m.ids)).map(kindOf);
  const flips = [];
  let n = 0;
  for(let i = 0; i < g.wall.length; i += 2){
    const id = g.wall[i], c = mine.filter(k => k === kindOf(id)).length;
    flips.push({ id, c });
    if(!c) break;
    n += c;
  }
  return { flips, n };
}
function kyokuEnd(res, g){
  return new Promise(resolve => {
    const t = UI.token;

        <div class="row muted" style="font-size:13px">도라 표시패 ${res.doraIndIds.map(id=>tileId(id)).join('')}${uraShown?' · 뒷도라 표시패 '+res.uraInd.map(k=>tile(k)).join(''):''}</div>` +
        res.wins.map(w => {
          const r = w.res;
          const hand = w.hand.slice().sort((a,b)=>a-b).map(id=>tileId(id,{size:'md'})).join('') + '<span style="width:8px;display:inline-block"></span>' + tileId(w.winTile,{size:'md',cls:'last'});

function drawChart(){
  const cv = document.getElementById('chart'); if(!cv) return;
  const data = cleanGames(records());
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const c = cv.getContext('2d'); c.scale(dpr,dpr);
  const cs = getComputedStyle(document.documentElement);
  const col = n => cs.getPropertyValue(n).trim();
  const L = 36, R = 10, T = 10, B = 24;
  const rates = data.map(x => x.rate*100);
  let lo = Math.max(0, Math.floor((Math.min(...rates)-5)/10)*10), hi = Math.min(100, Math.ceil((Math.max(...rates)+5)/10)*10);
  if(hi - lo < 20){ lo = Math.max(0, hi - 20); }
  const x = i => data.length === 1 ? L + (W-L-R)/2 : L + i*(W-L-R)/(data.length-1);
  const y = v => T + (hi - v)*(H-T-B)/(hi-lo);
  c.font = '11px ' + col('--f-num'); c.fillStyle = col('--ink-dim'); c.strokeStyle = col('--felt-line'); c.lineWidth = 1;
  for(let v = lo; v <= hi; v += 10){ c.beginPath(); c.moveTo(L, y(v)); c.lineTo(W-R, y(v)); c.stroke(); c.fillText(v + '%', 2, y(v)+4); }
  c.fillText('1판', L-6, H-6); if(data.length > 1){ const t = data.length + '판'; c.fillText(t, W-R-c.measureText(t).width, H-6); }
  c.fillStyle = col('--ink-dim');
  rates.forEach((v,i) => { c.beginPath(); c.arc(x(i), y(v), 2.6, 0, Math.PI*2); c.fill(); });
  const ma = rates.map((_,i) => { const s = data.slice(Math.max(0,i-9), i+1); return avgRate(s)*100; });
  c.strokeStyle = col('--brass'); c.lineWidth = 2.5; c.beginPath();
  ma.forEach((v,i) => i ? c.lineTo(x(i), y(v)) : c.moveTo(x(i), y(v))); c.stroke();
  const li = ma.length - 1; c.fillStyle = col('--brass'); c.beginPath(); c.arc(x(li), y(ma[li]), 4.5, 0, Math.PI*2); c.fill();
}

  }

function decCard(d){
  const shown = d.hand.slice();
  let drawnIdx = -1;
  if(d.drawn != null){ drawnIdx = shown.lastIndexOf(d.drawn); }
  const base = shown.filter((_,i) => i !== drawnIdx);
  const order = drawnIdx >= 0 ? base.concat(['|', d.drawn]) : base;
  let meDone = false, aiDone = false;
  const tiles = order.map(k => {
    if(k === '|') return '<span style="width:8px;display:inline-block"></span>';
    let cls = '';
    const isMe = !meDone && k === d.me.k, isAi = !aiDone && k === d.ai.k;
    if(isMe && isAi) cls = 'both'; else if(isMe) cls = 'mine'; else if(isAi) cls = 'ai';
    if(isMe) meDone = true; if(isAi) aiDone = true;
    return tile(k, {size:'md', cls});
  }).join('');
  if(d.board) setNP(d.board.N || d.board.rivers.length);
  const melds = (d.melds||[]).map(m => Array.isArray(m) ? `<span class="meld">${m.map(k=>tile(k)).join('')}</span>` : meldHTML(m, 'sm', 'meld', 0)).join('');
  const me = Object.assign({}, d.me, {_threat:d.threat}), ai = Object.assign({}, d.ai, {_threat:d.threat});
  const same = d.me.k === d.ai.k;
  return `<div class="dec ${d.match?'ok':''}">
    <div class="row muted" style="font-size:12px;justify-content:space-between"><span>${esc(d.label)} · ${d.turn}번째 타패</span><span>${MODE[d.mode]||''}</span></div>
    ${boardHTML(d)}
    <div class="tiles">${tiles}</div>${melds?`<div class="melds">${melds}</div>`:''}
    <div class="lines">${ukHTML('나', 'var(--alert)', me)}${same ? '' : ukHTML('AI', '#4fb0ff', ai)}${d.match?'':`<span class="why">${esc(whyText(d))}</span>`}</div></div>`;
}

const RPG_KEY = 'rm.rpg.v1';
const TIERS = [
  {n:'브론즈', c:'#9a5a2c'}, {n:'실버', c:'#cdd5dd'}, {n:'골드', c:'#f5cc35'}, {n:'아이언', c:'#7b8087'}, {n:'스틸', c:'#c9ced4'},

function rpgNorm(st){

// 시간 흐름 처리: 지난 시간만큼 틱을 돌려 exp를 준다
function rpgAdvance(offline){
  const st = RPG.st, now = Date.now();
  let dt = now - (st.last || now); st.last = now;
  if(!st.active){ st.carry = 0; return null; }
  if(offline && dt > OFFLINE_CAP) dt = OFFLINE_CAP;
  if(dt > OFFLINE_CAP * 2) dt = OFFLINE_CAP * 2;
  const k = st.active, sk = st.sk[k], T = tickMs(sk.stage, sk.gear);
  st.carry += dt;
  const n = Math.floor(st.carry / T);

  const before = lvOf(sk.exp);
  const gain = Math.max(0, Math.min(n * expPer(sk.stage), EXP_CAP(sk.gear) - sk.exp));
  sk.exp += gain;
  const after = lvOf(sk.exp);
  const cap = capped(sk);
  if(cap){ st.active = null; st.carry = 0; }   // 상한에 닿으면 멈춘다. 다음 장비를 사야 이어서 오른다
  return { k, n, gain, before, after, cap };
}

const SWING_MS = 1150, SWING_HIT = 0.55;

}

    let pt = {x: e.clientX, y: e.clientY};
    const els = [...document.querySelectorAll('.sk.dnext')];
    if(els.length){ let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity; els.forEach(el => { const q = el.getBoundingClientRect(); l = Math.min(l, q.left); t = Math.min(t, q.top); r = Math.max(r, q.right); b = Math.max(b, q.bottom); }); pt = {x: (l + r) / 2, y: (t + b) / 2}; }
    dealTake(pt); return;
  }
  if(UI.pendingDraw){ if(!UI.pendingDraw.flying) flyIn(); return; }   // 쯔모(패산·영상패): 끌어 오거나 우클릭하면 손으로 날아온다
  const pd = UI.pending, g = UI.game;
  if(pd && pd.kind === 'action' && UI.riichiDiscard != null) return;   // 리치 선언패를 눕혔으면 점봉만 던질 수 있다
  if(!pd || UI.confirm) return;
  // 넘기기는 버튼 없이 우클릭으로만: 치·퐁·깡, 리치 중 안깡, 론·쯔모
  if(pd.kind === 'call' && callFromKami()){   // 상가 패: 넘기기는 패산에서 쯔모하는 것 — 우클릭해도 패산에서 쯔모해 온다
    if(UI.callStage) return;
    const w = document.querySelector('.wnext'), r = w && w.getBoundingClientRect();
    UI.autoTake = { x: r ? r.left + r.width / 2 : e.clientX, y: r ? r.top + r.height / 2 : e.clientY, at: Date.now() };
    choose(null); return;
  }
  if(pd.kind === 'call' || pd.kind === 'riichiKan'){ choose(null); return; }
  if(pd.kind === 'ron' || pd.kind === 'tsumo'){ choose(false); return; }   // 론·쯔모도 넘기기는 우클릭으로만
  if(pd.kind === 'riichiNuki'){ choose(false); return; }
  if(pd.kind !== 'action' || !g || !g.drawn || g.drawn.seat !== 0) return;
  const id = g.drawn.id;
  if(!g.players[0].hand.includes(id)) return;
  const k = kindOf(id);
  if(UI.riichiMode && !pd.ctx.riichiOptions.includes(k)) return;
  if(pd.ctx.riichiOptions.includes(k)){ setRiichiDiscard(id); return; }
  choose({type:'discard', id, riichi:false});
});
document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-tile]')){ e.preventDefault(); onTile(+e.target.dataset.tile); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'file' && t.files[0]){
    const fr = new FileReader();
    fr.onload = () => { const m = document.getElementById('iomsg'); try{ const n = importCode(fr.result); if(m) m.textContent = `${n}판을 불러왔어요${UI.importedRpg ? ' · RPG 진행도도 덮어썼어요' : ''}.`; setTimeout(render, 600); }catch(err){ if(m) m.textContent = '불러오지 못했어요: ' + err.message; } };
    fr.readAsText(t.files[0]); return;
  }
  if(t.id === 's-hint') settings.hint = t.checked;
  else if(t.id === 's-skip') settings.skipDeal = t.checked;
  else if(t.id === 's-phone') settings.phone = t.checked;
  else if(t.id === 's-alice') settings.alice = t.checked;
  else return;
  store.set(KEY.set, settings);
});
window.addEventListener('resize', () => { if(UI.screen === 'records') drawChart(); });
document.body.insertAdjacentHTML('afterbegin', TileFaces.symbols());
draw();
if(window.__rig !== undefined || location.hash === "#t") window.__t = { get UI(){ return UI; }, choose, flyIn, kindOf, render };
})();
</script>
